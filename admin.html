<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FindIt Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#060817;color:#f7f8ff;font-family:Inter,system-ui}main{max-width:1100px;margin:auto;padding:32px 18px}h1{font-size:clamp(38px,7vw,68px);margin:5px 0}.g{background:linear-gradient(90deg,#956fff,#32d9ff);-webkit-background-clip:text;color:transparent}.sub{color:#9ca7c6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0d1228dd;border:1px solid #293355;border-radius:20px;padding:20px}.metric b{font-size:34px;display:block}.wide{grid-column:span 2}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #222b49;text-align:left}input,button{padding:12px;border-radius:12px;border:1px solid #354064;background:#0d1228;color:white}button{background:linear-gradient(90deg,#7958ff,#168dff);font-weight:800;border:0}.login{max-width:470px;margin:15vh auto}.hidden{display:none}.row{display:flex;gap:8px}.row input{flex:1}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media(max-width:440px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main><section id="login" class="card login"><h2>🔐 Private FindIt dashboard</h2><p class="sub">Enter your admin key.</p><div class="row"><input id="key" type="password"><button id="open">Open</button></div><p id="err" class="sub"></p></section><section id="dash" class="hidden"><p class="sub">FINDIT BETA • PRIVATE ANALYTICS</p><h1>FindIt <span class="g">Dashboard</span></h1><p class="sub">See how FindIt performs for real users.</p><div class="grid"><div class="card metric"><span>Total searches</span><b id="s">—</b></div><div class="card metric"><span>Search success</span><b id="sr">—</b></div><div class="card metric"><span>Useful nearby</span><b id="nr">—</b></div><div class="card metric"><span>👍 / 👎</span><b id="fb">—</b></div><div class="card wide"><h3>Top items</h3><table><tbody id="items"></tbody></table></div><div class="card wide"><h3>Top categories</h3><table><tbody id="cats"></tbody></table></div><div class="card wide"><h3>Countries</h3><table><tbody id="countries"></tbody></table></div><div class="card wide"><h3>Last 30 days</h3><table><thead><tr><th>Date</th><th>Searches</th><th>Nearby</th><th>👍</th><th>👎</th></tr></thead><tbody id="daily"></tbody></table></div></div></section></main><script>
let k="";const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), rows=a=>(a||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td></tr>`).join("")||"<tr><td>No data yet</td><td>—</td></tr>";
async function load(){let r=await fetch("/api/analytics",{headers:{"x-findit-admin-key":k}}),d=await r.json();if(!r.ok)throw Error(d.error);$("#login").classList.add("hidden");$("#dash").classList.remove("hidden");$("#s").textContent=d.totals.searches;$("#sr").textContent=d.totals.searchSuccessRate==null?"—":d.totals.searchSuccessRate+"%";$("#nr").textContent=d.totals.usefulNearbyRate==null?"—":d.totals.usefulNearbyRate+"%";$("#fb").textContent=d.totals.thumbsUp+" / "+d.totals.thumbsDown;$("#items").innerHTML=rows(d.topItems);$("#cats").innerHTML=rows(d.topCategories);$("#countries").innerHTML=rows(d.countries);$("#daily").innerHTML=(d.daily||[]).slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.searches}</td><td>${x.nearby}</td><td>${x.positive}</td><td>${x.negative}</td></tr>`).join("")||"<tr><td colspan=5>No data yet</td></tr>"}
$("#open").onclick=async()=>{k=$("#key").value;try{await load()}catch(e){$("#err").textContent=e.message}};$("#key").onkeydown=e=>{if(e.key==="Enter")$("#open").click()};
</script></body></html>
