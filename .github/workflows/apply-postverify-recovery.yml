name: Apply Post-Verification Recovery
on:
  push:
    branches: [fix-postverify-grounded-recovery-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[postverify-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-postverify-grounded-recovery-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch-postverify-recovery.py
      - run: node --check api/product-intelligence-v2.js
      - name: Verify safety and generic exact-product invariants
        run: |
          grep -q "const BLOCKED=" api/product-intelligence-v2.js
          grep -q "coreModelCompatible" api/product-intelligence-v2.js
          grep -q "branchStockVerified:false" api/product-intelligence-v2.js
          grep -q "universalGroundedRecovery" api/product-intelligence-v2.js
      - name: Commit patch
        run: |
          git config user.name "findit-postverify-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-intelligence-v2.js
          git commit -m "Recover exact grounded commerce after source verification [postverify-done]"
          git push
