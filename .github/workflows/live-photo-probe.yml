name: FindIt Live Photo Probe
on:
  push:
    branches: [main, fix/live-photo-final-20260925]
  pull_request:
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe real live photo
        shell: bash
        run: |
          set -e
          curl -L --fail --max-time 20 -o /tmp/product.jpg 'https://i.ebayimg.com/00/s/MTYwMFgxMjAw/z/FjQAAOSwL3Zk-O6Z/%24_57.JPG?set_id=8800005007'
          curl -sS --max-time 60 -o /tmp/result.json -w '%{http_code}' -F 'image=@/tmp/product.jpg;type=image/jpeg' https://deploy-preview-111--findit-nearby.netlify.app/api/search > /tmp/status
          node - <<'NODE'
          const fs=require('fs');
          const status=fs.readFileSync('/tmp/status','utf8').trim();
          const x=JSON.parse(fs.readFileSync('/tmp/result.json','utf8'));
          console.log('LIVE_PHOTO_RESULT',JSON.stringify({httpStatus:status,code:x.code,provider:x.provider,providerStatus:x.providerStatus,identification:x.identification||null}));
          if(status!=='200'||!x.identification) process.exit(1);
          NODE
