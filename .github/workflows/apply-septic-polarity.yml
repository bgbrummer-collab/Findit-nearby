name: Apply Septic-safe Product Info Polarity

on:
  push:
    branches:
      - fix-product-info-septic-polarity-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply septic-safe polarity patch
        run: python3 scripts/fix-septic-polarity.py
      - name: Run Product Info regressions
        run: |
          node tests/product-web-research-regression.mjs
          node tests/product-web-live-integration.mjs || true
      - name: Commit patched backend
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-cleaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-insights.js
          git commit -m "Keep septic-safe facts out of Product Info cons [skip patch]"
          git push
