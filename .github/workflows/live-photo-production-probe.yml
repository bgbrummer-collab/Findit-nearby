name: Live Photo Production Probe
on:
  push:
    branches: [qa/live-photo-probe-20260924]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download ordinary retail product photo
        run: |
          curl -L --fail --retry 2 -o /tmp/product.jpg 'https://i.ebayimg.com/00/s/MTYwMFgxMjAw/z/FjQAAOSwL3Zk-O6Z/%24_57.JPG?set_id=8800005007'
          test -s /tmp/product.jpg
      - name: Probe live FindIt photo identification
        run: |
          code=$(curl -sS --max-time 55 -o /tmp/result.json -w '%{http_code}' -F 'image=@/tmp/product.jpg;type=image/jpeg' https://findit-nearby.netlify.app/api/search)
          cat /tmp/result.json
          test "$code" = "200"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/result.json','utf8')); if(!x.identification) throw new Error('Live photo was not identified: '+JSON.stringify({code:x.code,message:x.message,provider:x.provider})); const s=JSON.stringify(x.identification).toLowerCase(); if(!s.includes('marc')||!s.includes('anthony')||!s.includes('condition')) throw new Error('Wrong live identity: '+JSON.stringify(x.identification)); console.log('LIVE_PHOTO_IDENTIFICATION_PASS',x.identification.name||x.identification.searchQuery);"
