name: FindIt Responsive Layout Regression
on:
  push:
    branches: [main]
    paths: ['manual-location.js', 'upload-validation.js', 'tests/upload-location-browser.mjs', 'user-first-polish.js', 'user-pov-hardening.js', 'information-runtime.js', 'dashboard-audit-controls.js', 'redesign-v4.js', 'redesign-v4.css', 'tests/dashboard-layout-regression.mjs', 'tests/saved-product-journey.mjs', '.github/workflows/dashboard-layout-regression.yml', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/dashboard-layout-regression.yml']
jobs:
  layout:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
      - name: Test eight local viewport sizes
        env:
          FINDIT_URL: http://127.0.0.1:4173/
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/findit-layout-http.log 2>&1 &
          sleep 2
          node tests/dashboard-layout-regression.mjs
      - name: Wait for this production deployment
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 40); do
            current=$(curl -fsS --max-time 10 https://findit-nearby.bgbrummer.workers.dev/api/version || true)
            frontend=$(curl -fsS --max-time 10 https://findit-nearby.bgbrummer.workers.dev/ || true)
            if CURRENT_VERSION="$current" node -e 'try { process.exit(JSON.parse(process.env.CURRENT_VERSION || "{}").commit === process.env.EXPECTED_COMMIT ? 0 : 1); } catch { process.exit(1); }' && [[ "$frontend" == *"<meta name=\"findit-build\" content=\"$EXPECTED_COMMIT\">"* ]]; then exit 0; fi
            sleep 3
          done
          echo 'Production did not report the expected commit'; exit 1
      - name: Test eight production viewport sizes
        if: github.event_name != 'pull_request'
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
          LAYOUT_SCREENSHOTS: layout-evidence
          FINDIT_EXPECTED_COMMIT: ${{ github.sha }}
        run: node tests/dashboard-layout-regression.mjs
      - name: Verify production upload inputs and manual location at three viewport sizes
        if: github.event_name != 'pull_request'
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
          FINDIT_EXPECTED_COMMIT: ${{ github.sha }}
        run: node tests/upload-location-browser.mjs
      - name: Verify real saved-product persistence and reopen journey
        if: github.event_name != 'pull_request'
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/saved-product-journey.mjs
      - name: Verify feedback consent and draft recovery with simulated delivery
        if: github.event_name != 'pull_request'
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/feedback-feature-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-layout-evidence
          path: layout-evidence/
          if-no-files-found: ignore
