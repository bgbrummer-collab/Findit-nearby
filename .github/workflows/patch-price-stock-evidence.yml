name: Patch price and stock evidence
on:
  push:
    branches: [fix-price-stock-evidence-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[price-stock-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-price-stock-evidence-20260906
      - name: Patch evidence pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/product-resolver.js')
          s=p.read_text()
          old="if(Number(x.confidence||0)<.72||!hostMatches(x.url,p.domain)||!isProductUrl(x.url,p.domain)||!strong(`${x.title||''} ${x.url||''}`,q,b))continue;"
          new="if(Number(x.confidence||0)<.82||!hostMatches(x.url,p.domain)||!isProductUrl(x.url,p.domain)||!strong(`${x.title||''} ${x.url||''}`,q,b))continue;"
          assert old in s
          s=s.replace(old,new,1)
          old="out.push(offerBase(x.title||q,pv,av,x.url,p,Number(x.confidence||0),'Google-grounded retailer result'))"
          new="const g=offerBase(x.title||q,pv,av,x.url,p,Number(x.confidence||0),'Google-grounded retailer result');g.searchGroundedVerified=true;g.evidenceLevel='google_grounded_retailer';out.push(g)"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('lib/retailer-coverage.js')
          s=p.read_text()
          old="source:'Google-grounded retailer coverage',retailer:"
          new="source:'Google-grounded retailer coverage',searchGroundedVerified:true,evidenceLevel:'google_grounded_retailer',retailer:"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('api/product-intelligence-v2.js')
          s=p.read_text()
          old="function trustedWithoutPage(o){const s=norm(`${o?.source||''} ${o?.retailer?.source||''}`);return /connected retailer feed|catalog|partner feed|retailer api/.test(s)}"
          new="function trustedWithoutPage(o,body){const s=norm(`${o?.source||''} ${o?.retailer?.source||''}`);if(/connected retailer feed|catalog|partner feed|retailer api/.test(s))return true;const grounded=o?.searchGroundedVerified===true||/google grounded retailer (result|coverage)/.test(s);if(!grounded||o?.verified!==true||Number(o?.matchScore||0)<.82)return false;const p=profileFor(o?.product_url,o?.retailer?.name,body);return Boolean(p&&directProductUrl(o?.product_url,p.domain)&&exactEnough(o?.product_name,o?.product_url,body,p))}"
          assert old in s
          s=s.replace(old,new,1)
          old="const trusted=rows.filter(trustedWithoutPage),untrusted=rows.filter(o=>!trustedWithoutPage(o)).slice(0,18);"
          new="const trusted=rows.filter(o=>trustedWithoutPage(o,body)),untrusted=rows.filter(o=>!trustedWithoutPage(o,body)).slice(0,18);"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('exact-retailer-fix.js')
          s=p.read_text()
          old="source:o.source||'',sourcePageVerified:o.sourcePageVerified===true}"
          new="source:o.source||'',sourcePageVerified:o.sourcePageVerified===true,searchGroundedVerified:o.searchGroundedVerified===true}"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('Each result below passed exact-identity evidence and retailer-page verification. Branch stock remains separate until a physical branch proves it.','Each result below passed exact-identity checks plus trustworthy retailer evidence. Online price/stock can come from a verified retailer page or high-confidence grounded retailer evidence. Physical-branch stock remains separate until that branch proves it.',1)
          old="<p>✓ Exact product-page match • ${esc(stockText(o.availability))}</p>"
          new="<p>${o.sourcePageVerified?'✓ Verified retailer product page':o.searchGroundedVerified?'✓ Google-grounded retailer evidence':'✓ Verified retailer evidence'} • ${esc(stockText(o.availability))}</p>"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("' • verified online price at ${esc(offer.retailer)}'","' • verified online price evidence at ${esc(offer.retailer)}'",1)
          p.write_text(s)
          PY
          node --check lib/product-resolver.js
          node --check lib/retailer-coverage.js
          node --check api/product-intelligence-v2.js
          node --check exact-retailer-fix.js
          grep -q 'searchGroundedVerified' api/product-intelligence-v2.js
          grep -q 'searchGroundedVerified' exact-retailer-fix.js
          grep -q 'const BLOCKED' api/product-intelligence-v2.js
      - name: Commit patch
        run: |
          git config user.name findit-price-stock-fix-bot
          git config user.email actions@users.noreply.github.com
          git add lib/product-resolver.js lib/retailer-coverage.js api/product-intelligence-v2.js exact-retailer-fix.js
          git commit -m "Preserve trustworthy grounded online price and stock evidence [price-stock-patched]"
          git push origin HEAD:fix-price-stock-evidence-20260906
