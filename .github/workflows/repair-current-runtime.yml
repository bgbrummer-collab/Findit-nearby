name: Repair current FindIt runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-current-runtime.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard legacy DOM references and current map view
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('script.js')
          s=p.read_text()
          marker='const photo=$("#photo"),cameraPhoto=$("#cameraPhoto")'
          guard='''/* CURRENT UI LEGACY DOM GUARD — prevents obsolete result handlers from crashing the app. */\nconst __finditLegacyIds=[\n  ["resultTitle","h2"],["summary","p"],["analysis","div"],["warning","div"],["offers","div"],["noOffers","div"],["nothingFound","div"],\n  ["listViewBtn","button"],["mapWrap","div"],["searchOnline","a"],["onlineQueryText","span"],["searchNearbyFree","a"],["copyQuery","button"],\n  ["similarSearch","a"],["retry","button"],["changeItem","button"],["correctSearch","button"],["recentList","div"],["clearRecent","button"],\n  ["feedbackTopic","select"],["includeTechnical","input"],["sendFeedback","button"],["copyFeedback","button"],["thumbUp","button"],["thumbDown","button"]\n];\nfor(const [id,tag] of __finditLegacyIds){if(!document.getElementById(id)){const e=document.createElement(tag);e.id=id;e.className="hidden legacy-compat-node";if(id==="nothingFound")e.innerHTML="<p></p>";if(id==="includeTechnical")e.type="checkbox";document.body.appendChild(e)}}\n'''
          if 'CURRENT UI LEGACY DOM GUARD' not in s and marker in s:
              s=s.replace(marker,guard+marker,1)
          p.write_text(s)

          p=Path('exact-retailer-fix.js')
          s=p.read_text()
          if 'CURRENT MAP VIEW BRIDGE' not in s:
              s += '''\n\n/* CURRENT MAP VIEW BRIDGE — current UI uses #map directly. */\n(()=>{\n  document.addEventListener('click',e=>{\n    const b=e.target.closest?.('#mapViewBtn');if(!b)return;\n    const map=document.getElementById('map');if(!map)return;\n    e.preventDefault();\n    map.classList.toggle('hidden');\n    if(!map.classList.contains('hidden')){\n      Promise.resolve(window.finditLoadLeaflet?.()).then(()=>{try{if(typeof ensureMap==='function')ensureMap();if(typeof updateMap==='function')updateMap();setTimeout(()=>window.state?.map?.invalidateSize?.(),120)}catch{}});\n      b.textContent='Hide map';\n    }else b.textContent='Map view';\n  },true);\n})();\n'''
          p.write_text(s)
          PY
      - name: Validate syntax
        run: |
          node --check script.js
          node --check exact-retailer-fix.js
      - name: Commit repair
        run: |
          rm .github/workflows/repair-current-runtime.yml
          git config user.name "FindIt QA Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js exact-retailer-fix.js .github/workflows/repair-current-runtime.yml
          git commit -m "Prevent legacy UI crashes and repair current map view"
          git push
