name: One-off FindIt Search Timeout Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-fix-search-timeout.yml'
      - '.github/scripts/hotfix_search.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image search
        run: python3 .github/scripts/hotfix_search.py
      - name: Check syntax
        run: node --check api/search.js
      - name: Commit hotfix
        run: |
          git config user.name "findit-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/search.js
          git diff --cached --quiet && exit 0
          git commit -m "Tune image identification timeout [skip ci]"
          git push origin HEAD:main
