name: One-off FindIt Search Flow Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-fix-search-timeout.yml'
      - '.github/scripts/hotfix_search.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch search flow
        run: python3 .github/scripts/hotfix_search.py
      - name: Check syntax
        run: |
          node --check api/search.js
          node --check exact-retailer-fix.js
      - name: Commit hotfix
        run: |
          git config user.name "findit-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/search.js exact-retailer-fix.js index.html .github/workflows/real-world-nine-item-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m "Align live search flow and cache bust [skip ci]"
          git push origin HEAD:main
