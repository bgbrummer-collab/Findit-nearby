name: Apply Dashboard Sync Root Fix
on:
  push:
    branches: [fix-dashboard-sync-root-20260904]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip root sync patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-dashboard-sync-root.py
      - run: node --check script.js
      - run: node --check redesign-v4.js
      - name: Verify payload-based dashboard sync
        run: |
          grep -q "CustomEvent('findit:results-rendered',{detail:{result:data}})" script.js
          grep -q "function syncAll(resultOverride)" redesign-v4.js
          grep -q "syncAll(e.detail?.result)" redesign-v4.js
      - name: Commit fix
        run: |
          git config user.name "findit-dashboard-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js redesign-v4.js
          git commit -m "Pass identified result directly to dashboard sync [skip root sync patch]"
          git push
