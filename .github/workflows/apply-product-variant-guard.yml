name: Apply Product Variant Guard

on:
  push:
    branches:
      - fix-product-source-variant-conflicts-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-product-source-variant-conflicts-20260903
          fetch-depth: 0
      - name: Apply exact variant guard
        run: python3 scripts/apply-product-variant-guard.py
      - name: Run Product Info regressions
        run: |
          node tests/product-source-variant-regression.mjs
          node tests/product-output-cleaning-regression.mjs
          node tests/product-category-research-regression.mjs
          node tests/product-web-research-regression.mjs
      - name: Commit backend patch
        run: |
          git config user.name "findit-variant-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-insights.js
          git diff --cached --quiet && exit 0
          git commit -m "Reject conflicting product variants in research sources [skip patch]"
          git push origin HEAD:fix-product-source-variant-conflicts-20260903
