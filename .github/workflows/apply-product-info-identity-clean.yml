name: Apply Product Info Identity Clean

on:
  push:
    branches:
      - fix-product-info-clean-output-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-product-info-clean-output-20260903
          fetch-depth: 0
      - name: Patch identity-aware final cleaning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-insights.js')
          s=p.read_text()
          s=s.replace("if ((x.match(/,/g) || []).length >= 5 && !PURPOSE_FACT.test(x)) return '';", "if ((x.match(/,/g) || []).length >= 5) return '';", 1)
          old="""  candidates.sort((a, b) => sentenceScore(b, i) - sentenceScore(a, i));
            return candidates[0] || '';
          }"""
          new="""  candidates.sort((a, b) => sentenceScore(b, i) - sentenceScore(a, i));
            const parts = identityParts(i);
            const branded = candidates.filter(x => !parts.brand || brandMatchScore(norm(x), parts) >= 0);
            return branded[0] || candidates[0] || '';
          }"""
          if old not in s: raise SystemExit('bestPurpose block not found')
          s=s.replace(old,new,1)
          old2="""  let what = cleanVisible(out.whatItDoes, i);
            if (!what || isNegativeEvidence(what)) what = bestPurpose(i, pages);"""
          new2="""  let what = cleanVisible(out.whatItDoes, i);
            const fallbackNeedsBrand = out.researchMethod === 'Exact-product web evidence' && what && identityParts(i).brand && brandMatchScore(norm(what), identityParts(i)) < 0;
            if (!what || isNegativeEvidence(what) || fallbackNeedsBrand) what = bestPurpose(i, pages);"""
          if old2 not in s: raise SystemExit('sanitize what block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Run Product Info regressions
        run: |
          node tests/product-output-cleaning-regression.mjs
          node tests/product-category-research-regression.mjs
          node tests/product-web-research-regression.mjs
      - name: Commit patched backend
        run: |
          git config user.name "findit-cleaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-insights.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep Product Info summaries on the exact identity [skip patch]"
          git push origin HEAD:fix-product-info-clean-output-20260903
