name: Apply final cleanup patch
on:
  push:
    branches: [final-cleanup-20260909]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[final-cleanup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch research junk filtering and release plan gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-insights.js')
          s=p.read_text()
          old="const DISPLAY_JUNK = /accessible version|data-testid|picturehighquality|\\bsrc\\s*=|\\bhref\\s*=|\\balt\\s*=|\\bclass\\s*=|\\bstyle\\s*=|javascript:|webpack|aria-|\\bhttps?:\\/\\/|\\\\[nrt]|<[^>]+>/i;"
          new="const DISPLAY_JUNK = /accessible version|data-testid|picturehighquality|!\\s*image\\s*\\d+|encrypted-tbn\\d*\\.gstatic\\.com|faviconv2|\\bsrc\\s*=|\\bhref\\s*=|\\balt\\s*=|\\bclass\\s*=|\\bstyle\\s*=|javascript:|webpack|aria-|\\bhttps?:\\/\\/|\\\\[nrt]|<[^>]+>/i;"
          if old not in s: raise SystemExit('DISPLAY_JUNK target not found')
          s=s.replace(old,new,1)
          old2="  out.sources = (Array.isArray(out.sources) ? out.sources : []).map(src => ({\n    ...src,\n    title: clean(String(src?.title || 'Product source').replace(/<[^>]+>/g, ' ').replace(/&lt;[^&]+&gt;/gi, ' '), 180) || 'Product source'\n  })).slice(0, 6);"
          new2="  out.sources = (Array.isArray(out.sources) ? out.sources : []).filter(src => {\n    const u=String(src?.url||''); const t=String(src?.title||'');\n    return /^https?:\\/\\//i.test(u) && !/encrypted-tbn\\d*\\.gstatic\\.com|faviconv2/i.test(u) && !/^image\\s*\\d+$/i.test(t.trim());\n  }).map(src => ({\n    ...src,\n    title: clean(String(src?.title || 'Product source').replace(/<[^>]+>/g, ' ').replace(/&lt;[^&]+&gt;/gi, ' '), 180) || 'Product source'\n  })).slice(0, 6);"
          if old2 not in s: raise SystemExit('sources sanitizer target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          w=Path('.github/workflows/release-smoke.yml')
          s=w.read_text()
          anchor="          node tests/price-stock-product-info-regression.mjs 2>&1 | tee qa-results/price-stock-product-info-regression.log\n          price_stock_info=${PIPESTATUS[0]}"
          repl=anchor+"\n          node tests/plan-isolation-audit.mjs 2>&1 | tee qa-results/plan-isolation-audit.log\n          plan_isolation=${PIPESTATUS[0]}"
          if anchor not in s: raise SystemExit('release smoke insertion target not found')
          s=s.replace(anchor,repl,1)
          oldif='[ "$price_stock_info" -eq 0 ]; then'
          newif='[ "$price_stock_info" -eq 0 ] && [ "$plan_isolation" -eq 0 ]; then'
          if oldif not in s: raise SystemExit('release smoke condition target not found')
          s=s.replace(oldif,newif,1)
          s=s.replace('price_stock_info=$price_stock_info" > qa-results/live-smoke-status.txt','price_stock_info=$price_stock_info plan_isolation=$plan_isolation" > qa-results/live-smoke-status.txt',1)
          w.write_text(s)
          PY
          node --check api/product-insights.js
          grep -q 'plan-isolation-audit.mjs' .github/workflows/release-smoke.yml
      - name: Commit patch
        run: |
          git config user.name findit-final-cleanup-bot
          git config user.email actions@users.noreply.github.com
          git add api/product-insights.js .github/workflows/release-smoke.yml
          git commit -m 'Filter image-search junk and gate releases on plan isolation [final-cleanup-done]'
          git push
