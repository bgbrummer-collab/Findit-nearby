name: Add Label Consistency Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-label-consistency-guard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prevent unsupported packaged-product variant wording
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('api/search.js')
          s=p.read_text()
          marker="if(i.model&&!i.modelEvidence){i.model=null;i.confidence=Math.min(i.confidence,.68);i.modelRemovedForEvidence=true}\n const draftName="
          insert="""if(i.model&&!i.modelEvidence){i.model=null;i.confidence=Math.min(i.confidence,.68);i.modelRemovedForEvidence=true}\n const labelFamily=norm([i.category,i.retailCategory,i.object].join(' '));\n const labelDriven=/grocery|food|bread|beverage|beauty|personal care|conditioner|shampoo|hair care|skincare|cosmetic|toiletr|household|cleaner|detergent/.test(labelFamily);\n const readableLabel=norm((i.visibleText||[]).join(' '));\n if(labelDriven&&readableLabel&&i.name){const brandText=norm(i.brand),objectText=norm(i.object);const generic=new Set(['product','item','pack','bottle','tube','loaf','hair','care','beauty','personal','food','white','black','conditioner','shampoo','bread']);const unsupported=norm(i.name).split(' ').filter(t=>t.length>3&&!generic.has(t)&&!readableLabel.includes(t)&&!brandText.includes(t)&&!objectText.includes(t));if(unsupported.length){i.name=[i.brand,i.object].filter(Boolean).join(' ')||i.object||i.name;i.searchQuery=i.name;i.model=null;i.modelEvidence=false;i.confidence=Math.min(i.confidence,.82);i.labelVariantReduced=true;i.verificationNote=(i.verificationNote?i.verificationNote+' ':'')+'FindIt removed unsupported variant wording that was not present in readable label text.'}}\n const draftName="""
          if marker not in s:
              raise SystemExit('postProcess marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s)
          Path('.github/workflows/apply-label-consistency-guard.yml').unlink()
          PY
      - name: Commit general label evidence guard
        run: |
          git config user.name "findit-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/search.js .github/workflows/apply-label-consistency-guard.yml
          git commit -m "Remove unsupported variant wording from label-driven products"
          git pull --rebase origin main
          git push origin HEAD:main
