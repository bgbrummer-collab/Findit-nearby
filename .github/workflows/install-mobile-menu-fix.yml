name: Install standalone mobile menu fix
on:
  push:
    paths:
      - '.github/workflows/install-mobile-menu-fix.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject standalone menu controller
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='  <script src="mobile-menu-fix.js" defer></script>\n'
          if 'mobile-menu-fix.js' not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
          rm .github/workflows/install-mobile-menu-fix.yml
          git config user.name "FindIt Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/install-mobile-menu-fix.yml
          git commit -m "Load standalone mobile menu controller"
          git push
