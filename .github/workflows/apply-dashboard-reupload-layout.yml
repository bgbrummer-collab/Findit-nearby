name: Apply Dashboard Reupload Layout Fix

on:
  push:
    branches:
      - fix-dashboard-reupload-layout-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-dashboard-reupload-layout.py
      - name: Validate JavaScript
        run: node --check redesign-v4.js
      - name: Check reupload reset hooks
        run: |
          grep -q "resetForNewPhoto" redesign-v4.js
          grep -q "findit:new-photo-selected" redesign-v4.js
          grep -q "scrollRestoration='manual'" redesign-v4.js
          grep -q "keep dashboard anchored" redesign-v4.css
      - name: Commit patched dashboard
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-dashboard-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add redesign-v4.js redesign-v4.css
          git commit -m "Fix dashboard clipping and allow repeated photo searches [skip dashboard patch]"
          git push
