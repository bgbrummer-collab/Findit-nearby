name: One-off FindIt Result Pipeline Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-result-pipeline-hotfix.yml'
      - '.github/scripts/hotfix_result_pipeline.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch result pipeline
        run: python3 .github/scripts/hotfix_result_pipeline.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check journey-results-fix.js
          node --check journey-results-v3-fix.js
      - name: Commit hotfix
        run: |
          git config user.name "findit-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js journey-results-fix.js journey-results-v3-fix.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix nearby fallback and result screen regressions [skip ci]"
          git push origin HEAD:main
