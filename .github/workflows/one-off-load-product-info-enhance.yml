name: One-off Load Product Info Enhance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-load-product-info-enhance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert script tag safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="product-info-enhance.js?v=20260829-product-info1" defer></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('No </body> tag found')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "findit-product-info-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable richer product information [skip ci]"
          git push
