name: Automation Live PROAR Verify

on:
  push:
    branches:
      - automation-live-proar-verify-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Product Information retry flow repeatedly
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            'PROAR USB Condenser Microphone'
            'PROAR USB condenser microphone'
            'PROAR USB Condenser Microphone USB condenser microphone microphone'
          )
          for cycle in 1 2 3 4 5; do
            echo "Cycle $cycle"
            ok=0
            for attempt in 1 2 3; do
              q="${queries[$((attempt-1))]}"
              payload="$(jq -n --arg q "$q" '{identification:{name:"PROAR USB Condenser Microphone",brand:"PROAR",model:"",object:"USB condenser microphone",category:"microphone",retailCategory:"microphone",searchQuery:$q},offers:[],name:"PROAR USB Condenser Microphone",brand:"PROAR",model:"",category:"microphone",searchQuery:$q,researchAttempt:'"$attempt"'}')"
              out="$(curl --fail-with-body --silent --show-error --max-time 50 \
                -H 'content-type: application/json' \
                -H 'cache-control: no-cache' \
                --data "$payload" \
                https://findit-nearby.vercel.app/api/product-insights)"
              researched="$(echo "$out" | jq -r '.researched // false')"
              echo "attempt=$attempt researched=$researched checkedAt=$(echo "$out" | jq -r '.checkedAt // ""')"
              if [ "$researched" = "true" ] && [ -n "$(echo "$out" | jq -r '.whatItDoes // empty')" ]; then
                ok=1
                break
              fi
              sleep 1
            done
            test "$ok" = "1"
            sleep 2
          done
