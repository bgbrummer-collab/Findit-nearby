name: Live User Image Production Matrix
on:
  push:
    branches: [verify-user-images-20260906]
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Run five user images against real production
        env:
          FINDIT_URL: https://findit-nearby.vercel.app/
        run: node tests/live-user-image-production-matrix.mjs
