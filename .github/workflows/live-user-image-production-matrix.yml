name: Live User Image Production Matrix

concurrency:
  group: findit-live-user-image-production-matrix
  cancel-in-progress: true
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for production deployment
        if: github.event_name == 'push'
        run: sleep 70
      - name: Test five real user images against production
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/live-user-image-production-matrix.mjs
      - name: Verify real user value after matrix
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/live-user-value.mjs