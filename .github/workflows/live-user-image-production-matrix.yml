name: Live User Image Production Matrix

concurrency:
  group: findit-live-user-image-production-matrix
  cancel-in-progress: true
on:
  workflow_dispatch:
  # Run once when this workflow itself is updated on main, so the production
  # five-photo matrix can be verified after the partial-identity fix ships.
  push:
    branches: [main]
    paths:
      - .github/workflows/live-user-image-production-matrix.yml
      - tests/live-user-image-production-matrix.mjs
      - lib/product-intelligence-core.js
      - index.html
      - product-info-click-fix.js
      - product-info-enhance.js
      - dashboard-runtime-v8.js
      - api/nearby.js
permissions:
  contents: read
jobs:
  live-matrix:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm install --save-dev playwright@1.55.0
      - name: Wait for Cloudflare to serve this exact commit
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev
        run: |
          for attempt in $(seq 1 60); do
            actual="$(curl -fsS "$FINDIT_URL/api/version" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).commit||"")}catch{}})' 2>/dev/null || true)"
            if [ "$actual" = "$GITHUB_SHA" ]; then
              echo "PRODUCTION_COMMIT_PASS $actual"
              exit 0
            fi
            echo "Waiting for production commit: expected=$GITHUB_SHA actual=${actual:-unavailable}"
            sleep 10
          done
          echo "Production did not serve expected commit $GITHUB_SHA within 10 minutes"
          exit 1
      - name: Test five real user images against production
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/live-user-image-production-matrix.mjs
      - name: Verify real user value after matrix
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/live-user-value.mjs
