name: FindIt Release Smoke

on:
  push:
    branches: [main, stabilize-results-20260824]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Vercel deployment
        run: sleep 25
      - name: Run stable FindIt smoke suite
        env:
          MAIN_URL: https://findit-nearby.vercel.app/
          PREVIEW_URL: https://findit-nearby-git-stabilize-results-20260824-findit-nearby1.vercel.app/
        run: |
          mkdir -p qa-results
          if [ "${GITHUB_REF_NAME}" = "main" ]; then export FINDIT_URL="$MAIN_URL"; else export FINDIT_URL="$PREVIEW_URL"; fi
          echo "Testing $FINDIT_URL"
          set +e
          node tests/release-smoke.mjs 2>&1 | tee qa-results/live-smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then echo "PASS $(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa-results/live-smoke-status.txt; else echo "FAIL $(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa-results/live-smoke-status.txt; fi
          exit "$code"
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-release-smoke-${{ github.ref_name }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
