name: FindIt Release Smoke

on:
  push:
    branches: [main, stabilize-results-20260824]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local branch build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/findit-http.log 2>&1 &
          echo $! > /tmp/findit-http.pid
          sleep 2
      - name: Run stable FindIt smoke suite
        env:
          FINDIT_URL: http://127.0.0.1:4173/
        run: |
          mkdir -p qa-results
          set +e
          run_test() {
            label="$1"
            seconds="$2"
            file="$3"
            timeout --signal=TERM --kill-after=5s "${seconds}s" node "$file" 2>&1 | tee "qa-results/${label}.log"
            return ${PIPESTATUS[0]}
          }

          run_test user-experience-guard-regression 60 tests/user-experience-guard-regression.mjs; ux_guard=$?
          run_test live-smoke 240 tests/release-smoke.mjs; smoke=$?
          run_test product-trust-regression 90 tests/product-trust-regression.mjs; trust=$?
          run_test product-intelligence-route-regression 60 tests/product-intelligence-route-regression.mjs; route=$?
          run_test verified-product-research-regression 60 tests/verified-product-research-regression.mjs; research=$?
          run_test product-web-research-regression 60 tests/product-web-research-regression.mjs; web_research=$?
          run_test product-category-research-regression 90 tests/product-category-research-regression.mjs; category_research=$?
          run_test stationery-retailer-regression 60 tests/stationery-retailer-regression.mjs; stationery=$?
          run_test dashboard-tools-route-regression 60 tests/dashboard-tools-route-regression.mjs; dashboard_route=$?
          run_test dashboard-tools-regression 90 tests/dashboard-tools-regression.mjs; dashboard_tools=$?
          run_test price-stock-product-info-regression 90 tests/price-stock-product-info-regression.mjs; price_stock_info=$?
          run_test plan-isolation-audit 60 tests/plan-isolation-audit.mjs; plan_isolation=$?
          set -e

          if [ "$ux_guard" -eq 0 ] && [ "$smoke" -eq 0 ] && [ "$trust" -eq 0 ] && [ "$route" -eq 0 ] && [ "$research" -eq 0 ] && [ "$web_research" -eq 0 ] && [ "$category_research" -eq 0 ] && [ "$stationery" -eq 0 ] && [ "$dashboard_route" -eq 0 ] && [ "$dashboard_tools" -eq 0 ] && [ "$price_stock_info" -eq 0 ] && [ "$plan_isolation" -eq 0 ]; then
            echo "PASS $(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa-results/live-smoke-status.txt
            exit 0
          fi
          echo "FAIL $(date -u +%Y-%m-%dT%H:%M:%SZ) ux_guard=$ux_guard smoke=$smoke trust=$trust route=$route research=$research web_research=$web_research category_research=$category_research stationery=$stationery dashboard_route=$dashboard_route dashboard_tools=$dashboard_tools price_stock_info=$price_stock_info plan_isolation=$plan_isolation" > qa-results/live-smoke-status.txt
          exit 1
      - name: Probe live exact-product web research
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=5s 120s node tests/product-web-live-integration.mjs 2>&1 | tee qa-results/product-web-live-integration.log
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-release-smoke-${{ github.run_id }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
