name: FindIt Release Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: sleep 25
      - name: Run current production smoke
        env:
          FINDIT_URL: https://findit-nearby.vercel.app/
        run: |
          mkdir -p qa-results
          set +e
          node tests/release-smoke.mjs 2>&1 | tee qa-results/live-smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "PASS $(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa-results/live-smoke-status.txt
          else
            echo "FAIL $(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa-results/live-smoke-status.txt
          fi
          exit "$code"
      - name: Publish smoke result
        if: always() && github.event_name == 'push'
        run: |
          if [ ! -f qa-results/live-smoke-status.txt ]; then echo "FAIL smoke did not complete" > qa-results/live-smoke-status.txt; fi
          git config user.name 'findit-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-results/live-smoke-status.txt qa-results/live-smoke.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish live FindIt smoke result [skip ci]'
            git push
          fi
