name: FindIt Release Smoke

on:
  push:
    branches: [main, stabilize-results-20260824]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local branch build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/findit-http.log 2>&1 &
          echo $! > /tmp/findit-http.pid
          sleep 2
      - name: Run stable FindIt smoke suite
        env:
          FINDIT_URL: http://127.0.0.1:4173/
        run: |
          mkdir -p qa-results
          set +e
          node tests/release-smoke.mjs 2>&1 | tee qa-results/live-smoke.log
          smoke=${PIPESTATUS[0]}
          node tests/product-trust-regression.mjs 2>&1 | tee qa-results/product-trust-regression.log
          trust=${PIPESTATUS[0]}
          node tests/product-intelligence-route-regression.mjs 2>&1 | tee qa-results/product-intelligence-route-regression.log
          route=${PIPESTATUS[0]}
          node tests/verified-product-research-regression.mjs 2>&1 | tee qa-results/verified-product-research-regression.log
          research=${PIPESTATUS[0]}
          node tests/stationery-retailer-regression.mjs 2>&1 | tee qa-results/stationery-retailer-regression.log
          stationery=${PIPESTATUS[0]}
          set -e
          if [ "$smoke" -eq 0 ] && [ "$trust" -eq 0 ] && [ "$route" -eq 0 ] && [ "$research" -eq 0 ] && [ "$stationery" -eq 0 ]; then
            echo "PASS $(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa-results/live-smoke-status.txt
            exit 0
          fi
          echo "FAIL $(date -u +%Y-%m-%dT%H:%M:%SZ) smoke=$smoke trust=$trust route=$route research=$research stationery=$stationery" > qa-results/live-smoke-status.txt
          exit 1
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-release-smoke-${{ github.run_id }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
