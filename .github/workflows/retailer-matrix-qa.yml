name: Retailer matrix production QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retailer-matrix-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wait for production
        run: sleep 25
      - name: Verify retailer matrix
        run: |
          node <<'NODE'
          const base='https://findit-nearby.vercel.app';
          const tests=[
            {label:'Grocery / Twinsaver',body:{brand:'Twinsaver',model:'Twin Ply 18 Rolls',name:'Twinsaver Twin Ply Toilet Paper 18 Rolls',query:'Twinsaver Twin Ply 18 Rolls toilet paper',category:'grocery/household'},need:['Takealot','Makro','Checkers','Pick n Pay','Shoprite','Woolworths']},
            {label:'Nike footwear',body:{brand:'Nike',model:'Air Force 1 Low',name:'Nike Air Force 1 Low sneaker',query:'Nike Air Force 1 Low sneaker',category:'footwear'},need:['Takealot','Makro','Nike','Sportscene','Totalsports','Bash']},
            {label:'adidas footwear',body:{brand:'adidas',model:'Samba OG',name:'adidas Samba OG shoes',query:'adidas Samba OG shoes',category:'footwear'},need:['Takealot','Makro','adidas','Sportscene','Totalsports','Bash']},
            {label:'Electronics / Sony',body:{brand:'Sony',model:'WH-1000XM5',name:'Sony WH-1000XM5 headphones',query:'Sony WH-1000XM5 headphones',category:'electronics'},need:['Takealot','Makro','Incredible Connection','Game','HiFi Corp']},
            {label:'Hardware / Bosch',body:{brand:'Bosch',model:'GSB 185-LI',name:'Bosch GSB 185-LI cordless drill',query:'Bosch GSB 185-LI cordless drill',category:'hardware'},need:['Takealot','Makro','Builders','Game','Leroy Merlin']}
          ];
          const rows=[];
          for(const t of tests){
            let data={},status=0,error='';
            try{const r=await fetch(base+'/api/product-intelligence-v2',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(t.body),signal:AbortSignal.timeout(50000)});status=r.status;data=await r.json();}catch(e){error=e.message}
            const names=(data.webRetailers||[]).map(x=>x.name);
            const missing=t.need.filter(x=>!names.includes(x));
            const unsafe=(data.offers||[]).filter(o=>o.branchStockVerified===true||o.directionsAvailable===true);
            const badPrice=(data.offers||[]).filter(o=>o.price!=null&&(!Number.isFinite(Number(o.price))||Number(o.price)<=0));
            const badUrl=(data.offers||[]).filter(o=>{try{return !/^https?:$/.test(new URL(o.product_url).protocol)}catch{return true}});
            const ok=status===200&&data.ok===true&&missing.length===0&&data.branchStockVerified===false&&data.directionsAvailable===false&&unsafe.length===0&&badPrice.length===0&&badUrl.length===0;
            rows.push({label:t.label,ok,status,missing,offerCount:(data.offers||[]).length,verifiedSellerCount:data.verifiedSellerCount||0,unsafe:unsafe.length,badPrice:badPrice.length,badUrl:badUrl.length,message:data.message||error});
            console.log(ok?'PASS':'FAIL',t.label,JSON.stringify(rows.at(-1)));
          }
          const fs=require('fs');fs.mkdirSync('qa-results',{recursive:true});
          const report={generated:new Date().toISOString(),rows,passed:rows.filter(x=>x.ok).length,total:rows.length};
          fs.writeFileSync('qa-results/retailer-matrix-latest.json',JSON.stringify(report,null,2));
          fs.writeFileSync('qa-results/retailer-matrix-latest.md',['# Retailer Matrix Production QA','',`Generated: ${report.generated}`,'',...rows.map(x=>`${x.ok?'✅':'❌'} **${x.label}** — status ${x.status}, offers ${x.offerCount}, verified sellers ${x.verifiedSellerCount}, missing fallbacks: ${x.missing.join(', ')||'none'}, unsafe directions: ${x.unsafe}`),'',`Passed: ${report.passed}/${report.total}`].join('\n'));
          if(rows.some(x=>!x.ok))process.exitCode=1;
          NODE
      - name: Publish report and remove one-shot workflow
        if: always()
        run: |
          rm .github/workflows/retailer-matrix-qa.yml
          git config user.name 'FindIt Retailer QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-results/retailer-matrix-latest.json qa-results/retailer-matrix-latest.md .github/workflows/retailer-matrix-qa.yml
          git commit -m 'Publish retailer matrix production QA [skip ci]'
          git pull --rebase origin main || true
          git push
