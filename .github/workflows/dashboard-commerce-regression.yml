name: FindIt Dashboard Commerce Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: findit-dashboard-commerce-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Vercel production deployment
        run: sleep 30

      - name: Run dashboard, product info, commerce, nearby and failure-case regression suite
        env:
          BASE_URL: https://findit-nearby.vercel.app
        run: node tests/dashboard-commerce-regression.mjs
