name: Apply Product Information content cleanup
on:
  push:
    branches: [final-cleanup-20260909]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[product-content-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove breadcrumbs, instructions and affiliate noise
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-insights.js')
          s=p.read_text()
          old="const DISPLAY_JUNK = /accessible version|data-testid|picturehighquality|!\\s*image\\s*\\d+|encrypted-tbn\\d*\\.gstatic\\.com|faviconv2|\\bsrc\\s*=|\\bhref\\s*=|\\balt\\s*=|\\bclass\\s*=|\\bstyle\\s*=|javascript:|webpack|aria-|\\bhttps?:\\/\\/|\\\\[nrt]|<[^>]+>/i;"
          new="const DISPLAY_JUNK = /accessible version|data-testid|picturehighquality|!\\s*image\\s*\\d+|encrypted-tbn\\d*\\.gstatic\\.com|faviconv2|^\\s*title\\s*:|^\\s*home\\s*\\/.*collections?|find out where .{0,80} products? (?:are )?sold|for best results\\s*,?\\s*use with|\\bsrc\\s*=|\\bhref\\s*=|\\balt\\s*=|\\bclass\\s*=|\\bstyle\\s*=|javascript:|webpack|aria-|\\bhttps?:\\/\\/|\\\\[nrt]|<[^>]+>/i;"
          if old not in s: raise SystemExit('display junk target missing')
          s=s.replace(old,new,1)
          old2="    return /^https?:\\/\\//i.test(u) && !/encrypted-tbn\\d*\\.gstatic\\.com|faviconv2/i.test(u) && !/^image\\s*\\d+$/i.test(t.trim());"
          new2="    return /^https?:\\/\\//i.test(u) && !/encrypted-tbn\\d*\\.gstatic\\.com|faviconv2|rstyle\\.me|linksynergy\\.|awin1\\./i.test(u) && !/^image\\s*\\d+$/i.test(t.trim());"
          if old2 not in s: raise SystemExit('source filter target missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check api/product-insights.js
      - name: Commit patch
        run: |
          git config user.name findit-product-content-bot
          git config user.email actions@users.noreply.github.com
          git add api/product-insights.js
          git commit -m 'Clean Product Information facts and sources [product-content-done]'
          git push
