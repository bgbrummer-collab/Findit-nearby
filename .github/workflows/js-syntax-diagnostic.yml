name: FindIt JS Syntax Diagnostic
on:
  push:
    branches:
      - feat/netlify-no-gemini-finish-20260916
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -o pipefail
          failed=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              echo "SYNTAX_FAIL=$file"
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)
          exit "$failed"
