name: Apply Electrical Category Precedence Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-electrical-precedence-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put electrical accessories ahead of broad electronics matching
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p=Path('lib/retailers.js')
          s=p.read_text()
          pat=r"(if\(/electronic.*?return'electronics';)(.*?)(if\(/plug adapter.*?return'electrical';)"
          s2,n=re.subn(pat,lambda m:m.group(3)+m.group(2)+m.group(1),s,count=1)
          if n!=1:
              raise SystemExit('Could not reorder electrical precedence in lib/retailers.js')
          p.write_text(s2)

          p=Path('api/nearby.js')
          s=p.read_text()
          pat=r"(if\(/electronic.*?return\['electronics'.*?\];)(.*?)(if\(/plug adapter.*?return\['electrical'.*?\];)"
          s2,n=re.subn(pat,lambda m:m.group(3)+m.group(2)+m.group(1),s,count=1)
          if n!=1:
              raise SystemExit('Could not reorder electrical precedence in api/nearby.js')
          p.write_text(s2)

          Path('.github/workflows/apply-electrical-precedence-fix.yml').unlink()
          PY
      - name: Commit targeted general fix
        run: |
          git config user.name "findit-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/retailers.js api/nearby.js .github/workflows/apply-electrical-precedence-fix.yml
          git commit -m "Prioritize electrical accessories over broad electronics"
          git pull --rebase origin main
          git push origin HEAD:main
