name: Apply Feature State Sync Fix

on:
  push:
    branches:
      - fix-feature-state-sync-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-feature-state-sync.py
      - name: Validate JavaScript
        run: node --check dashboard-runtime-v8.js
      - name: Verify guard
        run: |
          grep -q "identityActions" dashboard-runtime-v8.js
          grep -q "identifyThen" dashboard-runtime-v8.js
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-feature-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard-runtime-v8.js
          git commit -m "Keep dashboard features synced with current identification [skip feature sync patch]"
          git push
