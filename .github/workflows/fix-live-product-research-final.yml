name: Fix live product research final
on:
  push:
    branches: [fix-live-product-research-final-20260908]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-product-research-final-20260908
      - name: Patch live research matching and junk filtering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-insights.js')
          s=p.read_text()
          old="if (/^pro+a?r$/.test(b.replace(/\\s+/g, '')) && /microphone|condenser|usb/.test(p)) return ["
          new="if (/^pro+a+r$/.test(b.replace(/\\s+/g, '')) && /microphone|condenser|usb/.test(p)) return ["
          if old not in s: raise SystemExit('PROAAR matcher anchor missing')
          s=s.replace(old,new,1)
          # Privacy/cookie/account/legal text is not product evidence. Keep safety filters intact.
          old2="const JUNK = /\\b(shipping|delivery|refund|return policy|checkout|seller review|customer service|cookie policy|privacy policy|sign in|log in|login|newsletter|loyalty|rewards|menu|where to buy|our story|press coverage|featured products|top sellers|view all)\\b/i;"
          new2="const JUNK = /\\b(shipping|delivery|refund|return policy|checkout|seller review|customer service|cookie policy|privacy policy|cookies?|identity verification|federal law|sign in|log in|login|newsletter|loyalty|rewards|menu|where to buy|our story|press coverage|featured products|top sellers|view all|provide our products and services|recommendations|engage with our site)\\b/i;"
          if old2 not in s: raise SystemExit('JUNK anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check api/product-insights.js
          grep -q "const BLOCKED" api/product-insights.js
          git config user.name findit-final-fix-bot
          git config user.email actions@users.noreply.github.com
          git add api/product-insights.js
          git commit -m "Fix uncommon microphone research and reject privacy junk"
          git push origin HEAD:fix-live-product-research-final-20260908