name: Apply Product Info Reliability

on:
  push:
    branches:
      - fix-product-info-reliability-20260903

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reliability patch
        run: python3 scripts/fix-product-info-reliability.py
      - name: Validate dashboard runtime
        run: |
          node --check dashboard-runtime-v8.js
          node tests/product-web-research-regression.mjs
      - name: Commit patched runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-reliability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard-runtime-v8.js
          git commit -m "Make Product Information research reliable [skip reliability patch]"
          git push
