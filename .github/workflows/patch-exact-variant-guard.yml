name: Patch exact variant guard
on:
  push:
    branches: [fix-commerce-source-reliability-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[exact-variant-guard]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-commerce-source-reliability-20260906
      - name: Reject sibling variants before accepting price or stock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-intelligence-v2.js')
          s=p.read_text()
          marker="function typeAliases(body){"
          helper="""function coreModelCompatible(core,body){const c=norm(core),model=toks(body.model),brand=norm(body.brand),types=new Set(typeAliases(body));const keys=model.filter(t=>t!==brand&&!types.has(t));if(!keys.length)return true;const signatures=keys.filter(t=>/\\d/.test(t));if(signatures.length&&!signatures.every(t=>c.includes(t)))return false;if(keys.length>=3&&keys.filter(t=>c.includes(t)).length<Math.max(2,Math.ceil(keys.length*.45)))return false;return true}\n"""
          # helper depends on typeAliases; place immediately after typeAliases instead of before it
          target="function typeAliases(body){const source=norm([body.object,body.category,body.retailCategory,body.name].filter(Boolean).join(' '));for(const [,aliases] of TYPE_GROUPS)if(aliases.some(a=>source.includes(norm(a))))return aliases.map(norm);return[]}\n"
          assert target in s
          s=s.replace(target,target+helper,1)

          old="function exactEnough(title,url,body,profile){const hay=norm(`${title||''} ${url||''}`),brand=norm(body.brand),pb=norm(profile?.brand);if(brand&&!hay.includes(brand)&&!(pb&&(brand.includes(pb)||pb.includes(brand))))return false;if(!typeCompatible(hay,body))return false;"
          new="function exactEnough(title,url,body,profile){const hay=norm(`${title||''} ${url||''}`),brand=norm(body.brand),pb=norm(profile?.brand);if(brand&&!hay.includes(brand)&&!(pb&&(brand.includes(pb)||pb.includes(brand))))return false;if(!typeCompatible(hay,body)||!coreModelCompatible(hay,body))return false;"
          assert old in s
          s=s.replace(old,new,1)

          old="function urlLooksExact(o,body){if(o?.listingType!=='retailer_search_verified'&&o?.source!=='Exact retailer search result')return true;try{const url=o.product_url||'',path=norm(decodeURIComponent(new URL(url).pathname)),hay=norm(`${o.product_name||''} ${path}`);if(!typeCompatible(hay,body))return false;"
          new="function urlLooksExact(o,body){try{const url=o.product_url||'',path=norm(decodeURIComponent(new URL(url).pathname)),hay=norm(`${o.product_name||''} ${path}`);if(!typeCompatible(hay,body)||!coreModelCompatible(hay,body))return false;if(o?.listingType!=='retailer_search_verified'&&o?.source!=='Exact retailer search result')return true;"
          assert old in s
          s=s.replace(old,new,1)

          old="function sourcePageMatches(title,bodyText,url,body,profile,ldName=''){const core=norm(`${title} ${ldName} ${url}`),full=norm(`${core} ${bodyText}`),brand=norm(body.brand),pb=norm(profile?.brand);if(brand&&!full.includes(brand)&&!(pb&&(brand.includes(pb)||pb.includes(brand))))return false;if(!typeCompatible(full,body))return false;"
          new="function sourcePageMatches(title,bodyText,url,body,profile,ldName=''){const core=norm(`${title} ${ldName} ${url}`),full=norm(`${core} ${bodyText}`),brand=norm(body.brand),pb=norm(profile?.brand);if(brand&&!full.includes(brand)&&!(pb&&(brand.includes(pb)||pb.includes(brand))))return false;if(!typeCompatible(full,body)||!coreModelCompatible(core,body))return false;"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check api/product-intelligence-v2.js
          grep -q 'coreModelCompatible' api/product-intelligence-v2.js
          grep -q 'const BLOCKED' api/product-intelligence-v2.js
      - name: Commit
        run: |
          git config user.name findit-exact-variant-bot
          git config user.email actions@users.noreply.github.com
          git add api/product-intelligence-v2.js
          git commit -m "Reject sibling variants in commerce evidence [exact-variant-guard]"
          git push origin HEAD:fix-commerce-source-reliability-20260906
