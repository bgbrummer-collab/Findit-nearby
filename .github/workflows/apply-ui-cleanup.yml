name: Apply FindIt UI cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-ui-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cleanup script to live page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="ui-cleanup.js?v=20260823-clean1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          rm .github/workflows/apply-ui-cleanup.yml
      - name: Validate
        run: |
          grep -q 'ui-cleanup.js?v=20260823-clean1' index.html
          node --check ui-cleanup.js
      - name: Commit cleanup
        run: |
          git config user.name "FindIt UI Cleanup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html ui-cleanup.js .github/workflows/apply-ui-cleanup.yml
          git commit -m "Remove duplicate and non-working FindIt options"
          git push
