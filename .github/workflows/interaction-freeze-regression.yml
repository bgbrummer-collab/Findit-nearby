name: FindIt Interaction Freeze Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findit-live-photo-ai-interaction-freeze-regression
  cancel-in-progress: false

jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm pkg set type=module
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/findit-http.log 2>&1 &
          sleep 2
      - name: Check local user interaction behavior
        env:
          FINDIT_URL: http://127.0.0.1:4173/
        run: |
          timeout --signal=TERM --kill-after=5s 120s node tests/user-experience-guard-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/dashboard-tools-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/feedback-feature-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/smart-choice-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/shopping-assistant-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/find-actions-hours-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/user-first-polish-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/user-pov-hardening-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/current-find-relevance-regression.mjs
          timeout --signal=TERM --kill-after=5s 60s node tests/upload-button-user-regression.mjs
          timeout --signal=TERM --kill-after=5s 60s node tests/retailer-candidates-user-regression.mjs
      - name: Wait for production deployment
        run: |
          for attempt in $(seq 1 60); do
            deployed=$(curl -fsS "https://findit-nearby.bgbrummer.workers.dev/api/version?expected=$GITHUB_SHA" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' || true)
            if [ "$deployed" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 5
          done
          echo "Production did not report the expected commit"
          exit 1
      - name: Check deployed FindIt interactions actually work
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: |
          timeout --signal=TERM --kill-after=5s 150s node tests/dashboard-tools-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/feedback-feature-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/smart-choice-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/shopping-assistant-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/find-actions-hours-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/user-first-polish-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/user-pov-hardening-regression.mjs
          timeout --signal=TERM --kill-after=5s 120s node tests/current-find-relevance-regression.mjs
          timeout --signal=TERM --kill-after=5s 45s node tests/upload-button-user-regression.mjs
          timeout --signal=TERM --kill-after=5s 60s node tests/retailer-candidates-user-regression.mjs
          # Photo/provider production coverage runs in the dedicated live-photo and
          # five-image matrix workflows. Keep this suite focused on interaction
          # responsiveness so it does not duplicate vision traffic and trigger
          # provider throttling after the interaction checks have passed.
