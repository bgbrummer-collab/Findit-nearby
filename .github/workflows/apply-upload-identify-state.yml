name: Apply Upload Identify State Fix

on:
  push:
    branches:
      - fix-upload-identify-state-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-upload-identify-state.py
      - name: Validate JavaScript
        run: node --check redesign-v4.js
      - name: Verify native file remains selected after dashboard bridge
        run: |
          grep -q "Keep the selected file on the native input until identification finishes" redesign-v4.js
          ! grep -q "input.value=''" <(awk '/function applySelectedFile/{flag=1} flag{print} /function wireUploads/{flag=0}' redesign-v4.js)
      - name: Commit patched dashboard bridge
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-upload-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add redesign-v4.js
          git commit -m "Preserve selected upload until identification completes [skip upload patch]"
          git push
