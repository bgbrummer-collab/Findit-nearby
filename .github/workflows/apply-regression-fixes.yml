name: Apply FindIt Regression Fixes

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-regression-fixes.mjs
      - .github/workflows/apply-regression-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: findit-regression-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted production fixes
        run: node scripts/apply-regression-fixes.mjs

      - name: Commit fixes when changed
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "findit-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-intelligence-v2.js api/product-insights.js api/nearby.js
          git commit -m "Fix product exactness, research quality and nearby ordering"
          git push origin HEAD:main
