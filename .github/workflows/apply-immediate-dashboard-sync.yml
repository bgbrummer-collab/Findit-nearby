name: Apply Immediate Dashboard Sync Fix

on:
  push:
    branches:
      - fix-immediate-dashboard-sync-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-immediate-dashboard-sync.py
      - run: node --check script.js
      - name: Verify immediate result sync
        run: |
          grep -q "state.result=data;renderIdentification(data.identification||{});try{document.dispatchEvent(new CustomEvent('findit:results-rendered'))}" script.js
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-dashboard-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js
          git commit -m "Sync dashboard immediately after identification [skip dashboard sync patch]"
          git push
