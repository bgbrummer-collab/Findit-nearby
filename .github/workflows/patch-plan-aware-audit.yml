name: Patch plan-aware audit

on:
  push:
    branches: [fix-live-commerce-grounding-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-commerce-grounding-20260907
      - name: Make full audit respect Free and Premium isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/full-site-audit.mjs')
          s=p.read_text()
          old='''for(const [nav,expected] of [['compare','Compare Prices'],['deals','Verified Deals'],['saved','Saved Items'],['history','History'],['alerts','Price & Stock Alerts'],['feedback','Feedback']]){\n await closeModal(page);await top(page);\n await safe(`Visible ${nav} tool opens`,async()=>{await clickVisible(page,`#finditExactShell [data-fxnav="${nav}"]`);if(!await visible(page,'#fxStableModal:not(.hidden)'))throw Error('visible modal did not open');const t=await modalText(page);if(!t.includes(expected))throw Error(t.slice(0,140));return expected});\n}\nawait closeModal(page);await top(page);'''
          new='''await safe('Free compare is Premium-gated',async()=>{await clickVisible(page,'#finditExactShell [data-fxnav="compare"]');if(!await visible(page,'#premiumModal:not(.hidden)'))throw Error('Free compare bypassed Premium gate');return 'Premium gate shown'});\nawait closeModal(page);await top(page);\nawait page.evaluate(()=>localStorage.setItem('findit_premium_beta','1'));\nawait page.reload({waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);\nif(!await visible(page,'#finditExactShell'))throw Error('dashboard missing after Premium activation');\nfor(const [nav,expected] of [['compare','Compare Prices'],['deals','Verified Deals'],['saved','Saved Items'],['history','History'],['alerts','Price & Stock Alerts']]){\n await closeModal(page);await top(page);\n await safe(`Premium ${nav} tool opens`,async()=>{await clickVisible(page,`#finditExactShell [data-fxnav="${nav}"]`);if(!await visible(page,'#fxStableModal:not(.hidden)'))throw Error('visible modal did not open');const t=await modalText(page);if(!t.includes(expected))throw Error(t.slice(0,140));return expected});\n}\nawait closeModal(page);await top(page);\nawait safe('Feedback tool remains available',async()=>{await clickVisible(page,'#finditExactShell [data-fxnav="feedback"]');if(!await visible(page,'#fxStableModal:not(.hidden)'))throw Error('feedback modal did not open');const t=await modalText(page);if(!t.includes('Feedback'))throw Error(t.slice(0,140));return 'Feedback'});\nawait closeModal(page);await top(page);'''
          if old not in s:
              raise SystemExit('expected outdated nav loop not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/full-site-audit.mjs
      - name: Commit audit correction
        run: |
          git config user.name "findit-audit-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/full-site-audit.mjs
          git commit -m "Make full audit respect Free and Premium feature isolation"
          git push origin HEAD:fix-live-commerce-grounding-20260907
