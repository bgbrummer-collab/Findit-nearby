name: Apply Final Retail Category Hardening
on:
  push:
    branches: [final-retail-category-hardening-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[final-hardening-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch retail rule precedence, image matrix and audit triggers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('api/search.js')
          s=p.read_text()
          old=""" const all=norm([i.object,i.name,i.brand,i.model,i.category,i.searchQuery,i.summary,i.productKind,i.scaleClass,...i.visibleText,...i.features,...i.evidence].join(' '));
 const rule=RETAIL_RULES.find(r=>r.test.test(all));if(rule){i.retailCategory=rule.category;const priority=[];if(rule.dealerBrand&&i.brand)priority.push(`${i.brand} dealer`);for(const s of rule.stores)if(!priority.some(x=>norm(x)===norm(s)))priority.push(s);i.likelyStoreTypes=priority.slice(0,6);i.retailRuleApplied=true}
"""
          new=""" const productIdentity=norm([i.object,i.name,i.brand,i.model,i.searchQuery,...i.visibleText].join(' '));
 const categoryContext=norm([i.category,i.retailCategory,i.summary,i.productKind,i.scaleClass,...i.features,...i.evidence].join(' '));
 const rule=RETAIL_RULES.find(r=>r.test.test(productIdentity))||RETAIL_RULES.find(r=>r.test.test(categoryContext));if(rule){i.retailCategory=rule.category;const priority=[];if(rule.dealerBrand&&i.brand)priority.push(`${i.brand} dealer`);for(const s of rule.stores)if(!priority.some(x=>norm(x)===norm(s)))priority.push(s);i.likelyStoreTypes=priority.slice(0,6);i.retailRuleApplied=true}
"""
          if old not in s: raise SystemExit('search rule block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/live-user-image-production-matrix.mjs')
          s=p.read_text()
          replacements={
          "{id:'marc',src:'tests/user-images/marc-anthony.jpg.b64',ext:'jpg',expect:/marc|anthony|curl|hair|lotion|condition/i}":"{id:'marc',src:'tests/user-images/marc-anthony.jpg.b64',ext:'jpg',category:'beauty',expect:/marc|anthony|curl|hair|lotion|condition/i}",
          "{id:'twinsaver',src:'tests/user-images/twinsaver.webp.b64',ext:'webp',expect:/twinsaver|toilet|tissue|paper|roll/i}":"{id:'twinsaver',src:'tests/user-images/twinsaver.webp.b64',ext:'webp',category:'grocery/household',expect:/twinsaver|toilet|tissue|paper|roll/i}",
          "{id:'nike',src:'tests/user-images/nike.jpg.b64',ext:'jpg',expect:/nike|air force|sneaker|shoe|footwear/i}":"{id:'nike',src:'tests/user-images/nike.jpg.b64',ext:'jpg',category:'footwear',expect:/nike|air force|sneaker|shoe|footwear/i}",
          "{id:'mic',src:'tests/user-images/mic.jpg.b64',ext:'jpg',expect:/proar|microphone|mic|usb|audio/i}":"{id:'mic',src:'tests/user-images/mic.jpg.b64',ext:'jpg',category:'electronics',expect:/proar|microphone|mic|usb|audio/i}",
          "{id:'glasses',src:'tests/user-images/glasses.jpg.b64',ext:'jpg',expect:/glass|eyeglass|spectacle|frame|optical|eyewear/i}":"{id:'glasses',src:'tests/user-images/glasses.jpg.b64',ext:'jpg',category:'eyewear',expect:/glass|eyeglass|spectacle|frame|optical|eyewear/i}"
          }
          for a,b in replacements.items():
            if a not in s: raise SystemExit(f'matrix fixture not found: {a[:30]}')
            s=s.replace(a,b,1)
          needle="if(!f.expect.test(label))fail(`${f.id}: implausible identification ${label}`);if(!snap.fxName"
          repl="if(!f.expect.test(label))fail(`${f.id}: implausible identification ${label}`);if(snap.category!==f.category)fail(`${f.id}: wrong retail category ${snap.category}; expected ${f.category}`);if(!snap.fxName"
          if needle not in s: raise SystemExit('matrix assertion insertion point not found')
          p.write_text(s.replace(needle,repl,1))

          p=Path('.github/workflows/final-production-audit.yml')
          s=p.read_text()
          anchor="      - 'premium-beta-fix.js'\n"
          extra="      - 'premium-beta-fix.js'\n      - 'big-clean-fix.js'\n      - 'premium-dashboard-guard.js'\n      - 'dashboard-runtime-stable.js'\n      - 'dashboard-runtime-v8.js'\n"
          if anchor not in s: raise SystemExit('audit trigger insertion point not found')
          if "      - 'big-clean-fix.js'\n" not in s:
            s=s.replace(anchor,extra,1)
          p.write_text(s)
          PY
      - name: Verify syntax and safety guard
        run: |
          node --check api/search.js
          node --check tests/live-user-image-production-matrix.mjs
          grep -q "const RESTRICTED=" api/search.js
          grep -q "productIdentity" api/search.js
          grep -q "categoryContext" api/search.js
          grep -q "wrong retail category" tests/live-user-image-production-matrix.mjs
      - name: Commit hardening
        run: |
          git config user.name findit-hardening-bot
          git config user.email actions@users.noreply.github.com
          git add api/search.js tests/live-user-image-production-matrix.mjs .github/workflows/final-production-audit.yml
          git commit -m "Fix retail category precedence and strengthen production gate [final-hardening-done]"
          git push
