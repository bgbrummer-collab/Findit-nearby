name: Apply commerce grounding model patch

on:
  push:
    branches: [fix-live-commerce-grounding-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-live-commerce-grounding-20260907
      - name: Patch reliable grounded commerce models
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-intelligence-v2.js')
          s=p.read_text()
          old="for(const model of ['gemini-3.6-flash','gemini-3.5-flash-lite']){"
          new="for(const model of ['gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-3.5-flash-lite']){"
          if old not in s:
              raise SystemExit('expected grounded model list not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check api/product-intelligence-v2.js
      - name: Commit patch
        run: |
          git config user.name "findit-commerce-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-intelligence-v2.js
          git commit -m "Use quota-safe grounded models for live commerce recovery"
          git push origin HEAD:fix-live-commerce-grounding-20260907
