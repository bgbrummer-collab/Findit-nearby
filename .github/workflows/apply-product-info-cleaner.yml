name: Apply Product Info Cleaner

on:
  push:
    branches:
      - fix-product-info-clean-output-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-product-info-clean-output-20260903
          fetch-depth: 0
      - name: Patch Product Info evidence cleaning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-insights.js')
          s=p.read_text()

          old="const DETAIL = /\\b(designed|formulated|features?|includes?|contains?|provides?|helps?|offers?|made|uses?|supports?|compatible|connects?|records?|recording|streaming|podcast|gaming|calls?|noise|monitoring|cardioid|sampling|frequency|battery|bluetooth|wireless|usb|plug.?and.?play|soft|strong|absorb|ply|rolls?|cushion|leather|rubber|variable speed|drilling|scientific|statistics|fraction|moistur|detang|frizz)\\b/i;"
          new=old+"\nconst DISPLAY_JUNK = /accessible version|data-testid|picturehighquality|\\bsrc\\s*=|\\bhref\\s*=|\\balt\\s*=|\\bclass\\s*=|\\bstyle\\s*=|javascript:|webpack|aria-|\\bhttps?:\\/\\/|\\\\[nrt]|\\{\\s*\\\"|\\\"\\s*:\\s*|<[^>]+>/i;\nconst NEGATIVE_FACT = /static noise|background noise|breaks?|broke|broken|stability issues?|unstable|issue|problem|drawback|limitation|difficult|tricky|struggle|poor|weak|fragile|hiss|crackle|distortion|latency|may not|cannot|doesn.t|does not|requires?|not included|sold separately|only compatible|heavy|bulky|short battery|limited|warning|not suitable|disappoint|inconsistent/i;\nconst POSITIVE_FACT = /plug.?and.?play|compatible|clear|cardioid|noise cancel|monitor|gain|stand|adapter|durab|soft|strong|absorb|moistur|detang|cushion|battery|wireless|bluetooth|usb|easy|support|adjustable|portable|reliable|quality|stream|record|included|includes?|fast|comfort|protect|capacity|variable speed/i;\nconst PURPOSE_FACT = /\\b(is|are|designed|made|used|helps?|provides?|formulated|records?|recording|streaming|connects?|supports?|for voice|for gaming|for calls?|for podcast|for household|for bathroom|for school|for drilling|for listening)\\b/i;"
          if old not in s: raise SystemExit('DETAIL marker missing')
          s=s.replace(old,new,1)

          old_point="""function point(v) {
            const x = clean(String(v || '')
              .replace(/^[-*•#>]+\\s*/, '')
              .replace(/\\[([^\\]]+)\\]\\([^)]*\\)/g, '$1')
              .replace(/https?:\\/\\/\\S+/g, '')
              .replace(/[*_`#>|]/g, ' '), 560);
            return x.length >= 18 && !JUNK.test(x) && !BLOCKPAGE.test(x) ? x : '';
          }"""
          new_point="""function point(v) {
            const raw = String(v || '')
              .replace(/<script[\\s\\S]*?<\\/script>/gi, ' ')
              .replace(/<style[\\s\\S]*?<\\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/\\b(?:data-testid|src|href|alt|class|style)\\s*=\\s*(?:\\\\?\"[^\"]*\\\\?\"|\\\\?'[^']*\\\\?'|[^\\s>]+)/gi, ' ')
              .replace(/\\[([^\\]]+)\\]\\([^)]*\\)/g, '$1')
              .replace(/https?:\\/\\/\\S+/g, ' ')
              .replace(/\\\\[nrt]/g, ' ')
              .replace(/[\\u{1F000}-\\u{1FAFF}]/gu, ' ')
              .replace(/^[-*•#>]+\\s*/, '')
              .replace(/[*_`#>|]/g, ' ');
            const x = clean(raw, 560);
            if (x.length < 18 || JUNK.test(x) || BLOCKPAGE.test(x) || DISPLAY_JUNK.test(String(v || ''))) return '';
            return x;
          }"""
          if old_point not in s: raise SystemExit('point marker missing')
          s=s.replace(old_point,new_point,1)

          marker="function parseJson(v) {"
          cleaner="""function looksLikeTitleDump(x, i) {
            const n = norm(x), words = n.split(' ').filter(Boolean);
            if (!x) return true;
            if (DISPLAY_JUNK.test(x)) return true;
            if ((x.match(/,/g) || []).length >= 5 && !PURPOSE_FACT.test(x)) return true;
            if (words.length >= 16 && !/[.!?]$/.test(x) && !PURPOSE_FACT.test(x)) return true;
            const id = norm(exactName(i));
            if (id && (n === id || (n.startsWith(id) && words.length < id.split(' ').length + 5))) return true;
            return false;
          }

          function cleanVisible(v, i) {
            const x = point(v);
            if (!x || looksLikeTitleDump(x, i)) return '';
            return x.replace(/\\s+([,.;:!?])/g, '$1').replace(/([.!?])\\1+/g, '$1').trim();
          }

          function bestPurpose(i, pages) {
            const candidates = [];
            for (const p of pages || []) {
              for (const line of evidenceLines(p.text)) {
                const x = cleanVisible(line, i);
                if (!x || NEGATIVE_FACT.test(x) || !PURPOSE_FACT.test(x)) continue;
                candidates.push(x);
              }
            }
            candidates.sort((a,b)=>sentenceScore(b,i)-sentenceScore(a,i));
            return candidates[0] || '';
          }

          function sanitizeAnswer(i, answer, pages) {
            const out = { ...answer };
            let what = cleanVisible(out.whatItDoes, i);
            if (!what || NEGATIVE_FACT.test(what) || !PURPOSE_FACT.test(what)) what = bestPurpose(i, pages);

            const pros = [], cons = [];
            const addUnique = (arr, x) => { if (x && !arr.some(y => norm(y) === norm(x))) arr.push(x); };
            for (const raw of Array.isArray(out.pros) ? out.pros : []) {
              const x = cleanVisible(raw, i);
              if (!x) continue;
              if (NEGATIVE_FACT.test(x)) addUnique(cons, x);
              else if (POSITIVE_FACT.test(x)) addUnique(pros, x);
            }
            for (const raw of Array.isArray(out.cons) ? out.cons : []) {
              const x = cleanVisible(raw, i);
              if (!x || !NEGATIVE_FACT.test(x)) continue;
              addUnique(cons, x);
            }

            const visibleSources = (Array.isArray(out.sources) ? out.sources : []).map(s => ({
              ...s,
              title: clean(String(s?.title || 'Product source').replace(/<[^>]+>/g, ' ').replace(/&lt;[^&]+&gt;/gi, ' '), 180) || 'Product source'
            }));

            out.whatItDoes = what;
            out.pros = pros.slice(0, 4);
            out.cons = cons.slice(0, 4);
            out.bestFor = cleanVisible(out.bestFor, i);
            out.standOut = cleanVisible(out.standOut, i);
            out.valueVerdict = cleanVisible(out.valueVerdict, i);
            out.sources = visibleSources.slice(0, 6);
            out.researched = !!(out.whatItDoes || out.pros.length || out.cons.length);
            return out;
          }

          """
          if marker not in s: raise SystemExit('parse marker missing')
          s=s.replace(marker,cleaner+marker,1)

          old_handler="""    const answer = await summarize(process.env.GEMINI_API_KEY, i, pages) || fallback(i, pages);
            return res.status(200).json(answer);"""
          new_handler="""    const answer = await summarize(process.env.GEMINI_API_KEY, i, pages) || fallback(i, pages);
            return res.status(200).json(sanitizeAnswer(i, answer, pages));"""
          if old_handler not in s: raise SystemExit('handler marker missing')
          s=s.replace(old_handler,new_handler,1)
          p.write_text(s)
          PY
      - name: Run focused regressions
        run: |
          node tests/product-output-cleaning-regression.mjs
          node tests/product-category-research-regression.mjs
          node tests/product-web-research-regression.mjs
      - name: Commit patched backend
        run: |
          git config user.name "findit-cleaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-insights.js
          git diff --cached --quiet && exit 0
          git commit -m "Clean and classify Product Info evidence [skip patch]"
          git push origin HEAD:fix-product-info-clean-output-20260903
