name: Apply image retry fix
on:
  push:
    branches: [fix-final-nearby-sync-20260906]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-final-nearby-sync-20260906
      - name: Add one safe retry for transient image-service failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('exact-retailer-fix.js')
          s=p.read_text()
          old="const c=new AbortController(),t=setTimeout(()=>c.abort(),75000);let r,data;try{r=await fetch('/api/search',{method:'POST',body:fd,signal:c.signal});data=await r.json().catch(()=>({}))}finally{clearTimeout(t)}if(!r.ok)throw new Error(data.message||data.error||`Search failed (${r.status})`);"
          new="let r,data;for(let attempt=0;attempt<2;attempt++){const c=new AbortController(),t=setTimeout(()=>c.abort(),45000);try{r=await fetch('/api/search',{method:'POST',body:fd,signal:c.signal});data=await r.json().catch(()=>({}))}catch(fetchErr){if(attempt===0){status('Image service was busy. Retrying identification…');await new Promise(res=>setTimeout(res,700));continue}throw fetchErr}finally{clearTimeout(t)}if(r.ok)break;const retryable=data?.retryable===true||r.status>=500;if(!retryable||attempt===1)throw new Error(data.message||data.error||`Search failed (${r.status})`);status('Image service was busy. Retrying identification…');await new Promise(res=>setTimeout(res,700))}if(!r?.ok)throw new Error(data?.message||data?.error||`Search failed (${r?.status||'unknown'})`);"
          if old not in s:
              if new in s:
                  print('Already fixed')
                  raise SystemExit(0)
              raise SystemExit('Target search block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check exact-retailer-fix.js
          git config user.name findit-search-retry-bot
          git config user.email actions@users.noreply.github.com
          git add exact-retailer-fix.js
          git diff --cached --quiet && exit 0
          git commit -m "Retry transient image identification failures once [image-retry-fix]"
          git push
