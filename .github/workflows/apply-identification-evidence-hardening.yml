name: Harden Exact Image Evidence Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-identification-evidence-hardening.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require visible evidence for package variants and tool sizes
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('api/search.js')
          s=p.read_text()
          old="brandEvidence=true only when the PRODUCT brand is directly visible or unmistakably supported by strong visual evidence. A printed place name, artwork label, map text, character or decorative logo must not automatically become the product brand. modelEvidence=true only when the exact model name/number is directly visible or the visual design is uniquely diagnostic; otherwise model must be null."
          new=old+" For packaged consumables, groceries, cosmetics, toiletries, hair-care and other label-driven products, an exact variant or model name must come from clearly readable label text. Never substitute a remembered product variant from packaging colour, shape or brand familiarity. For hand tools, dimensions, sizes and model numbers must be directly readable before they are placed in model, name or searchQuery; never infer a size from appearance."
          if old not in s:
              raise SystemExit('First-pass evidence sentence not found')
          s=s.replace(old,new,1)
          old2="5. Is the exact model truly supported? If no readable model text or uniquely diagnostic design exists, set model=null and modelEvidence=false. Never guess."
          new2=old2+" For packaged/label-driven products, exact variant wording must be present in readable visible text; brand familiarity is not enough. For tools, never invent a size, length or model number that is not readable in the image."
          if old2 not in s:
              raise SystemExit('Verifier evidence sentence not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          Path('.github/workflows/apply-identification-evidence-hardening.yml').unlink()
          PY
      - name: Commit evidence-based identification fix
        run: |
          git config user.name "findit-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/search.js .github/workflows/apply-identification-evidence-hardening.yml
          git commit -m "Require visible label and size evidence for exact identification"
          git pull --rebase origin main
          git push origin HEAD:main
