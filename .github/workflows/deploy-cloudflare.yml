name: Deploy FindIt to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "wrangler.toml"
      - "index.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Cloudflare static site
        shell: bash
        run: |
          rm -rf cloudflare-public
          mkdir -p cloudflare-public
          # FindIt is composed of the base page plus multiple production UI/runtime
          # layers loaded directly by index.html. Copy every root browser asset so
          # Cloudflare serves the same dashboard GitHub main contains.
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.ico' -o -name '*.png' -o -name '*.svg' -o -name '*.webp' \) -exec cp {} cloudflare-public/ \;
          [ -d assets ] && cp -R assets cloudflare-public/assets || true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.40.2"
          command: deploy
