name: Deploy FindIt to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: findit-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh dated public retailer locator fallback
        run: node scripts/refresh-sports-locator.mjs
      - name: Prepare Cloudflare static site
        shell: bash
        run: |
          rm -rf cloudflare-public
          mkdir -p cloudflare-public
          # FindIt is composed of the base page plus multiple production UI/runtime
          # layers loaded directly by index.html. Copy every root browser asset so
          # Cloudflare serves the same dashboard GitHub main contains.
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.ico' -o -name '*.png' -o -name '*.svg' -o -name '*.webp' -o -name 'robots.txt' -o -name 'sitemap.xml' \) -exec cp {} cloudflare-public/ \;
          mkdir -p cloudflare-public/lib
          cp lib/product-type-information.js cloudflare-public/lib/
          [ -d assets ] && cp -R assets cloudflare-public/assets || true
      - name: Stamp browser assets with the deployment version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('cloudflare-public/index.html')
          html = p.read_text()
          sha = os.environ['GITHUB_SHA']
          def stamp(match):
              attribute, path = match.groups()
              if path.startswith(('http://', 'https://', '//')):
                  return match.group(0)
              return f'{attribute}="{path}?build={sha}"'
          html = re.sub(r'\b(href|src)="([^"?#]+\.(?:css|js))(?:\?[^"]*)?"', stamp, html)
          html = html.replace('<head>', '<head><meta name="findit-build" content="'+sha+'">', 1)
          p.write_text(html)
          PY
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.40.2"
          command: deploy --var BUILD_COMMIT:${{ github.sha }}
