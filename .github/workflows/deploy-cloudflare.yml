name: Deploy FindIt to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "wrangler.toml"
      - "index.html"
      - "style.css"
      - "script.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Cloudflare static site
        shell: bash
        run: |
          rm -rf cloudflare-public
          mkdir -p cloudflare-public
          cp index.html style.css script.js cloudflare-public/
          [ -f manifest.webmanifest ] && cp manifest.webmanifest cloudflare-public/ || true
          [ -f sw.js ] && cp sw.js cloudflare-public/ || true
          [ -d assets ] && cp -R assets cloudflare-public/assets || true
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.40.2"
          command: deploy
