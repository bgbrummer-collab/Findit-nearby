name: Patch retailer second pass
on:
  push:
    branches: [fix-commerce-source-reliability-20260906]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[retailer-second-pass]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-commerce-source-reliability-20260906
      - name: Retry compact exact query when primary candidates fail verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/product-resolver.js')
          s=p.read_text()
          pat=r"async function resolveRetailer\(p,q,b\)\{.*?\}\nfunction parseJson"
          m=re.search(pat,s,flags=re.S)
          assert m
          repl="""async function resolveRetailer(p,q,b){const terms=retailerQueryVariants(q,b),search=directSearch(p,q),cands=[];const collect=async(u,term,retry=true)=>{const t=retry?await readerRetry(u,9000):await reader(u,6500);for(const c of urlsFrom(t,term,b,p))if(!cands.some(x=>x.url===c.url))cands.push(c)};const verify=async(start=0)=>{const found=[];for(const c of cands.slice(start,Math.min(cands.length,start+6))){const t=await readerRetry(c.url,10500);let o=offerFromText(t,c.url,q,b,p,c.label);if(!o)o=offerFromCandidate(c,q,b,p);if(o)found.push(o)}return found};const primary=[search,`https://www.bing.com/search?q=${encodeURIComponent(`site:${p.domain} \"${q}\"`)}`,`https://www.google.com/search?q=${encodeURIComponent(`site:${p.domain} \"${q}\"`)}`];for(const u of primary){await collect(u,q,true);if(cands.length>=4)break}let offers=await verify(0);if(!offers.length&&terms[1]){const before=cands.length,alt=terms[1];await collect(directSearch(p,alt),alt,false);if(cands.length===before)await collect(`https://www.bing.com/search?q=${encodeURIComponent(`site:${p.domain} \"${alt}\"`)}`,alt,false);if(cands.length>before)offers.push(...await verify(before))}return{status:{name:p.name,checked:true,searchUrl:search,exactListingFound:cands.length>0,verifiedOfferFound:offers.length>0,branchDataConnected:false,capability:capabilitySummary(p,false),error:offers.length?'':(cands.length?'product_page_unreadable':'search_unavailable')},offers}}\nfunction parseJson"""
          s=s[:m.start()]+repl+s[m.end():]
          p.write_text(s)
          PY
          node --check lib/product-resolver.js
          grep -q 'const before=cands.length' lib/product-resolver.js
          grep -q 'branchStockVerified:false' lib/product-resolver.js
      - name: Commit
        run: |
          git config user.name findit-retailer-retry-bot
          git config user.email actions@users.noreply.github.com
          git add lib/product-resolver.js
          git commit -m "Retry compact exact retailer query after failed candidates [retailer-second-pass]"
          git push origin HEAD:fix-commerce-source-reliability-20260906
