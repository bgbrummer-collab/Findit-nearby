name: FindIt Final Production Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-production-audit.yml'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'redesign-v4.css'
      - 'redesign-v4.js'
      - 'dashboard-runtime-fix.js'
      - 'scanner-flow.js'
      - 'journey-results-fix.js'
      - 'journey-results-v3-fix.js'
      - 'store-live-check.js'
      - 'mobile-menu-fix.js'
      - 'premium-upgrades.js'
      - 'qa-hardening.js'
      - 'qa-menu-routes.js'
      - 'qa-final-polish.js'
      - 'school-uniform-fix.js'
      - 'final-release-fixes.js'
      - 'api/**'
      - 'tests/release-smoke.mjs'
      - 'tests/dashboard-readiness.mjs'
      - 'tests/dashboard-all-functions.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: findit-final-production-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Vercel production
        run: sleep 40
      - name: Run all production audits and record result
        shell: bash
        run: |
          set +e

          run_suite() {
            local name="$1"
            local script="$2"
            local logfile="$3"
            echo ""
            echo "============================================================"
            echo "START: $name at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Script: $script"
            echo "Hard timeout: 10 minutes"
            echo "============================================================"

            timeout --signal=TERM --kill-after=30s 10m \
              env FINDIT_URL=https://findit-nearby.vercel.app/ node "$script" 2>&1 | tee "$logfile"
            local code=${PIPESTATUS[0]}

            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo "TIMEOUT: $name exceeded its 10-minute hard limit (exit $code)." | tee -a "$logfile"
            fi
            echo "FINISH: $name at $(date -u +'%Y-%m-%dT%H:%M:%SZ') with exit $code"
            return "$code"
          }

          run_suite "Release smoke" "tests/release-smoke.mjs" "/tmp/release.log"
          RELEASE=$?

          run_suite "Dashboard readiness" "tests/dashboard-readiness.mjs" "/tmp/readiness.log"
          READY=$?

          run_suite "Every dashboard function" "tests/dashboard-all-functions.mjs" "/tmp/functions.log"
          FUNCTIONS=$?

          status_text() {
            if [ "$1" -eq 0 ]; then
              echo PASS
            elif [ "$1" -eq 124 ] || [ "$1" -eq 137 ]; then
              echo TIMEOUT
            else
              echo FAIL
            fi
          }

          {
            echo "FindIt production audit"
            echo "Commit: $GITHUB_SHA"
            echo "Release smoke: $(status_text "$RELEASE") (exit $RELEASE)"
            echo "Dashboard readiness: $(status_text "$READY") (exit $READY)"
            echo "Every dashboard function: $(status_text "$FUNCTIONS") (exit $FUNCTIONS)"
            echo
            echo "--- release smoke ---"
            tail -n 80 /tmp/release.log
            echo
            echo "--- dashboard readiness ---"
            tail -n 100 /tmp/readiness.log
            echo
            echo "--- every dashboard function ---"
            tail -n 140 /tmp/functions.log
          } > AUDIT_LATEST.txt

          cat AUDIT_LATEST.txt

          git config user.name "findit-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AUDIT_LATEST.txt
          git commit -m "Record latest production audit [skip ci]" || true
          git push || true

          if [ "$RELEASE" -ne 0 ] || [ "$READY" -ne 0 ] || [ "$FUNCTIONS" -ne 0 ]; then
            exit 1
          fi
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-final-production-audit-${{ github.run_id }}
          path: |
            AUDIT_LATEST.txt
            audit-output/
            qa-results/
          if-no-files-found: warn
          retention-days: 14
