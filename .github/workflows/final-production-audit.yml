name: FindIt Final Production Audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'mobile-menu-fix.js'
      - 'premium-upgrades.js'
      - 'qa-hardening.js'
      - 'qa-menu-routes.js'
      - 'qa-final-polish.js'
      - 'school-uniform-fix.js'
      - 'final-release-fixes.js'
      - 'api/**'
      - 'tests/release-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Vercel production
        run: sleep 25
      - name: Run focused stable release smoke
        env:
          FINDIT_URL: https://findit-nearby.vercel.app/
        run: node tests/release-smoke.mjs
      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-final-production-audit-${{ github.run_id }}
          path: |
            audit-output/
            qa-results/
          if-no-files-found: warn
          retention-days: 14
