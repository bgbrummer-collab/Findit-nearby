name: Fix mobile menu overlap

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-menu.yml'

permissions:
  contents: write

jobs:
  fix-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore full mobile homepage and clean floating controls
        shell: bash
        run: |
          cat >> style.css <<'EOF'

          /* === FINAL MOBILE HOME + MENU FIX V2 === */
          @media (max-width:600px){
            main{display:block!important;visibility:visible!important;opacity:1!important;min-height:100vh!important}
            .reveal{opacity:1!important;transform:none!important;visibility:visible!important}
            .hero,.search-card,.examples-section,#how,.challenge-banner,.feedback-section,.recent-section{visibility:visible!important;opacity:1!important}
            .assistant-fab,.premium-fab{display:none!important}
            .mobile-nav{z-index:120!important}
            body{padding-bottom:78px}
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<nav class="drawer-nav"><a href="#home">⌂ Home</a><a href="#finder">📸 Find an item</a><a href="#how">✨ How it works</a><button id="openRecent">🕘 Recent finds</button><a href="#feedback">💬 Feedback</a><button id="openSettings">⚙ Settings</button></nav>'
          new='<nav class="drawer-nav"><a href="#home">⌂ Home</a><a href="#finder">📸 Find an item</a><a href="#how">✨ How it works</a><button id="openRecent">🕘 Recent finds</button><button id="drawerAskFindIt">✦ Ask FindIt</button><button id="drawerPremium">★ Premium</button><a href="#feedback">💬 Feedback</a><button id="openSettings">⚙ Settings</button></nav>'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          cat >> script.js <<'EOF'

          /* Mobile drawer shortcuts + visibility fallback V2 */
          document.addEventListener("DOMContentLoaded",()=>{
            document.getElementById("drawerAskFindIt")?.addEventListener("click",()=>{
              if(typeof closeDrawer==="function")closeDrawer();
              if(typeof openAssistant==="function")openAssistant();
            });
            document.getElementById("drawerPremium")?.addEventListener("click",()=>{
              if(typeof closeDrawer==="function")closeDrawer();
              if(typeof openPremium==="function")openPremium();
            });
            if(window.matchMedia("(max-width:600px)").matches){
              document.querySelectorAll(".reveal").forEach(el=>el.classList.add("visible"));
            }
          });
          EOF

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "FindIt Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add style.css index.html script.js
          git commit -m "Restore full FindIt mobile homepage and clean menu" || exit 0
          git push
