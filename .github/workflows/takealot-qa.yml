name: Takealot production verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/takealot-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wait for Vercel production
        run: sleep 25
      - name: Test Takealot exact product pipeline
        run: |
          node <<'NODE'
          const base='https://findit-nearby.vercel.app';
          const tests=[
            {label:'Sony WH-1000XM5',body:{brand:'Sony',model:'WH-1000XM5',name:'Wireless Noise-Cancelling Headphones',query:'Sony WH-1000XM5',category:'electronics'}},
            {label:'Bosch GSB 185-LI',body:{brand:'Bosch',model:'GSB 185-LI',name:'Cordless 18V Impact Drill',query:'Bosch GSB 185-LI cordless impact drill',category:'hardware'}},
            {label:'Logitech MX Master 3S',body:{brand:'Logitech',model:'MX Master 3S',name:'Performance Wireless Mouse',query:'Logitech MX Master 3S wireless mouse',category:'electronics'}}
          ];
          const rows=[];
          for(const t of tests){
            let ok=false,detail='',data=null;
            try{
              const r=await fetch(base+'/api/product-intelligence-v2',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(t.body),signal:AbortSignal.timeout(45000)});
              data=await r.json();
              const take=data?.takealot||{};
              const offer=take.best||data?.offers?.find(o=>o?.retailer?.name==='Takealot');
              const host=(()=>{try{return new URL(offer?.product_url||'').hostname}catch{return''}})();
              ok=r.ok&&take.checked===true&&take.matched===true&&!!offer&&/(^|\.)takealot\.com$/i.test(host)&&offer.verified===true&&offer.branchStockVerified===false;
              detail={status:r.status,takealot:take,offer:offer?{product_name:offer.product_name,price:offer.price,availability:offer.availability,product_url:offer.product_url,verified:offer.verified,matchScore:offer.matchScore,source:offer.source}:null};
            }catch(e){detail={error:e.message}}
            rows.push({label:t.label,ok,detail});
            console.log(ok?'PASS':'FAIL',t.label,JSON.stringify(detail));
          }
          const fs=require('fs');fs.mkdirSync('qa-results',{recursive:true});
          fs.writeFileSync('qa-results/takealot-latest.json',JSON.stringify({generated:new Date().toISOString(),rows},null,2));
          fs.writeFileSync('qa-results/takealot-latest.md',['# Takealot Production QA','',`Generated: ${new Date().toISOString()}`,'',...rows.map(x=>`${x.ok?'✅':'❌'} **${x.label}** — ${JSON.stringify(x.detail)}`),'',`Passed: ${rows.filter(x=>x.ok).length}/${rows.length}`].join('\n'));
          if(rows.some(x=>!x.ok))process.exitCode=1;
          NODE
      - name: Publish report and remove one-shot workflow
        if: always()
        run: |
          rm .github/workflows/takealot-qa.yml
          git config user.name 'FindIt Takealot QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-results/takealot-latest.json qa-results/takealot-latest.md .github/workflows/takealot-qa.yml
          git commit -m 'Publish Takealot production QA report [skip ci]'
          git push
