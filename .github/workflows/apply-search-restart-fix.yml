name: Apply Search Restart Fix
on:
  workflow_dispatch:
  push:
    branches: [finish-premium-workspace-20260905]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[restart-fix-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-premium-workspace-20260905
      - name: Patch exact-retailer search restart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('exact-retailer-fix.js')
          s=p.read_text()
          old='let running=false,runId=0,exactIdentity=null;'
          new='let running=false,runId=0,exactIdentity=null,activeFile=null;'
          if old in s: s=s.replace(old,new,1)
          old="e.preventDefault();e.stopImmediatePropagation();if(running)return;const s=S();if(!s?.file)"
          new="e.preventDefault();e.stopImmediatePropagation();const s=S();if(running){if(s?.file&&s.file!==activeFile){runId++;running=false}else return}if(!s?.file)"
          if old not in s and new not in s: raise SystemExit('runSearch guard pattern not found')
          s=s.replace(old,new,1)
          old="running=true;const id=++runId;target.disabled=true;clearResults();"
          new="running=true;activeFile=s.file;const id=++runId;target.disabled=true;clearResults();"
          if old not in s and new not in s: raise SystemExit('active file start pattern not found')
          s=s.replace(old,new,1)
          old="finally{if(id===runId){running=false;target.disabled=!S()?.file}}"
          new="finally{if(id===runId){running=false;activeFile=null;target.disabled=!S()?.file}}"
          if old not in s and new not in s: raise SystemExit('finally pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check exact-retailer-fix.js
          grep -q 'activeFile=s.file' exact-retailer-fix.js
      - name: Commit fix
        run: |
          git config user.name findit-search-fix-bot
          git config user.email actions@users.noreply.github.com
          git add exact-retailer-fix.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Allow a new photo search to replace enrichment in progress [restart-fix-done]'
          git push origin HEAD:finish-premium-workspace-20260905