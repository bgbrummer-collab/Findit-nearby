name: Install premium beta fix
on:
  push:
    paths:
      - '.github/workflows/fix-premium-beta.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Premium beta button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          old = 'e.preventDefault();e.stopImmediatePropagation();finditStartPremiumPayment();'
          new = 'e.preventDefault();'
          if old not in s:
              raise SystemExit('Premium override code not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-premium-beta.yml
          git config user.name "FindIt Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js .github/workflows/fix-premium-beta.yml
          git commit -m "Fix Premium Beta activation button"
          git push
