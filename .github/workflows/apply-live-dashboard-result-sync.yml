name: Apply Live Dashboard Result Sync
on:
  push:
    branches: [fix-live-dashboard-result-sync-20260904]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip live dashboard sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply-live-dashboard-result-sync.py
      - run: node --check script.js
      - name: Verify dashboard direct-sync and safety invariants
        run: |
          grep -q 'function syncExactDashboardResult(data)' script.js
          grep -q 'syncExactDashboardResult(data)' script.js
          grep -q 'fxProductName' script.js
          grep -q 'fxStatus' script.js
          grep -q 'const RESTRICTED=' api/search.js
          grep -q 'Find anything.' redesign-v4.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-live-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add script.js
          git commit -m "Sync successful identification directly into live dashboard [skip live dashboard sync]"
          git push
