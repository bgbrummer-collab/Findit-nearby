name: Apply Stability Polish
on:
  push:
    branches: [stability-polish-20260904]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip stability polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply-stability-polish.py
      - run: node --check script.js
      - run: node --check redesign-v4.js
      - run: node --check api/search.js
      - name: Verify safety and dashboard invariants
        run: |
          grep -q "Find anything." redesign-v4.js
          grep -q "data-fxnav=\"home\"" redesign-v4.js
          grep -q "syncAll(e.detail?.result)" redesign-v4.js
          grep -q "finditSearchRequest(fd)" script.js
          grep -q "const GEMINI_TIMEOUT_MS=10000;" api/search.js
          grep -q "const RESTRICTED=" api/search.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "findit-stability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add redesign-v4.js script.js api/search.js
          git commit -m "Improve dashboard sync and search resilience [skip stability polish]"
          git push
