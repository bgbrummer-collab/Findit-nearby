name: Uncommon Commerce Regression
on:
  push:
    branches: [main]
    paths:
      - 'lib/native-retailer-discovery.js'
      - 'lib/product-intelligence-core.js'
      - 'cloudflare/worker.js'
      - 'lib/jina-commerce-discovery.js'
      - 'lib/universal-commerce-discovery.js'
      - 'lib/grounded-commerce.js'
      - 'api/product-intelligence-v2.js'
      - 'tests/uncommon-commerce-regression.mjs'
      - '.github/workflows/uncommon-commerce-regression.yml'
  workflow_dispatch:
jobs:
  uncommon-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this commit in production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..36}; do
            commit=$(curl -fsS --max-time 10 https://findit-nearby.bgbrummer.workers.dev/api/version | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk).on("end",()=>{try{process.stdout.write(JSON.parse(text).commit||"")}catch{}})') || true
            if [ "$commit" = "$EXPECTED_COMMIT" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Expected production commit was not observed"
          exit 1
      - name: Verify deployed uncommon product discovery
        env:
          FINDIT_URL: https://findit-nearby.bgbrummer.workers.dev/
        run: node tests/uncommon-commerce-regression.mjs
