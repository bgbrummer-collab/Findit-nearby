name: Live Real Production Search Check

on:
  push:
    branches:
      - verify-real-production-search-20260904

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-real-production-search.mjs
