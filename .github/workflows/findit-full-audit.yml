name: FindIt Full Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'scanner-flow.js'
      - 'exact-retailer-fix.js'
      - 'offer-stability-fix.js'
      - 'ui-cleanup.js'
      - 'mobile-menu-fix.js'
      - 'premium-beta-fix.js'
      - 'premium-upgrades.js'
      - 'qa-hardening.js'
      - 'qa-menu-routes.js'
      - 'qa-final-polish.js'
      - 'final-release-fixes.js'
      - 'release-polish.js'
      - 'api/**'
      - 'tests/full-site-audit.mjs'
      - 'tests/final-audit-runner.mjs'
      - '.github/workflows/findit-full-audit.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start pull-request branch preview
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/findit-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/findit-http.log
          exit 1
      - name: Wait for production rollout
        if: github.event_name != 'pull_request'
        run: sleep 25
      - name: Run every-interaction audit
        id: audit
        continue-on-error: true
        env:
          FINDIT_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/' || 'https://findit-nearby.vercel.app/' }}
          AUDIT_OUT: audit-output
        run: timeout 150s node tests/final-audit-runner.mjs
      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-full-production-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow if audit found broken interactions
        if: steps.audit.outcome == 'failure'
        run: exit 1
