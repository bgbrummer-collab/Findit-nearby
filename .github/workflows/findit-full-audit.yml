name: FindIt Full Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'mobile-menu-fix.js'
      - 'premium-beta-fix.js'
      - 'premium-upgrades.js'
      - 'qa-hardening.js'
      - 'qa-menu-routes.js'
      - 'qa-final-polish.js'
      - 'api/**'
      - 'tests/full-site-audit.mjs'
      - '.github/workflows/findit-full-audit.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

# Hardened final production audit trigger: 2026-08-18
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for production deployment
        run: sleep 25

      - name: Run every-interaction production audit
        id: audit
        continue-on-error: true
        env:
          FINDIT_URL: https://findit-nearby.vercel.app/
          AUDIT_OUT: audit-output
        run: node tests/full-site-audit.mjs

      - name: Publish latest audit report into repository
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p qa-results
          if [ -f audit-output/findit-full-audit.json ]; then cp audit-output/findit-full-audit.json qa-results/latest.json; fi
          if [ -f audit-output/findit-full-audit.md ]; then cp audit-output/findit-full-audit.md qa-results/latest.md; fi
          git config user.name "findit-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa-results/latest.json qa-results/latest.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Update automated FindIt production audit report"
            git push
          fi

      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-full-production-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if audit found broken interactions
        if: steps.audit.outcome == 'failure'
        run: exit 1
