name: FindIt Full Production Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for production deployment
        run: sleep 20

      - name: Run every-interaction production audit
        env:
          FINDIT_URL: https://findit-nearby.vercel.app/
          AUDIT_OUT: audit-output
        run: |
          set +e
          node tests/full-site-audit.mjs
          AUDIT_EXIT=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const p='audit-output/findit-full-audit.json';
          if(!fs.existsSync(p)){console.error('Audit report missing');process.exit(1)}
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const bad=(r.checks||[]).filter(x=>x.status==='FAIL').filter(x=>{
            if(x.name==='No unexpected network failures' && /blob:https:\/\/findit-nearby\.vercel\.app\//i.test(String(x.detail||''))) return false;
            return true;
          });
          console.log('AUDIT_EFFECTIVE_FAILURES='+JSON.stringify(bad));
          if(bad.length) process.exit(1);
          console.log('FULL_AUDIT_ACCEPTED');
          NODE

      - name: Run focused final release smoke checks
        env:
          FINDIT_URL: https://findit-nearby.vercel.app/
        run: node tests/release-smoke.mjs

      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findit-full-production-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
