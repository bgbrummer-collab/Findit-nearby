name: Apply source quality fix
on:
  push:
    branches: [final-cleanup-20260909]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[source-quality-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve exact product source discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/product-insights.js')
          s=p.read_text()
          old="    if (!/^https?:$/.test(u.protocol) || /google\\.|bing\\.com|duckduckgo\\.com|youtube\\.|facebook\\.|instagram\\.|tiktok\\.|pinterest\\.|reddit\\./.test(host)) return null;"
          new="    if (!/^https?:$/.test(u.protocol) || /google\\.|gstatic\\.com|googleusercontent\\.com|bing\\.com|duckduckgo\\.com|youtube\\.|facebook\\.|instagram\\.|tiktok\\.|pinterest\\.|reddit\\./.test(host)) return null;"
          if old not in s: raise SystemExit('unwrap target not found')
          s=s.replace(old,new,1)
          old2="function likelyProductUrl(v) {\n  try {\n    const u = new URL(v), p = u.pathname.toLowerCase();"
          new2="function likelyProductUrl(v) {\n  try {\n    const u = new URL(v), p = u.pathname.toLowerCase();\n    if (/\\.(?:avif|bmp|gif|ico|jpe?g|png|svg|webp)(?:$|\\?)/i.test(u.pathname) || /(?:images?|img|cdn-images|media)\\./i.test(u.hostname)) return false;"
          if old2 not in s: raise SystemExit('likelyProductUrl target not found')
          s=s.replace(old2,new2,1)
          old3="function stableSourceHints(i) {\n  const b = norm(i.brand), p = norm(`${i.name} ${i.model} ${i.object} ${i.category} ${i.searchQuery}`);"
          new3="function stableSourceHints(i) {\n  const b = norm(i.brand), p = norm(`${i.name} ${i.model} ${i.object} ${i.category} ${i.searchQuery}`);\n  if (/^marc anthony$/.test(b) && /strictly curls.*3x moisture.*conditioner|3x moisture.*triple blend conditioner/.test(p)) return [\n    'https://marcanthony.com/products/strictly-curls%C2%AE-3x-moisture-triple-blend-conditioner'\n  ];"
          if old3 not in s: raise SystemExit('stable hints target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          node --check api/product-insights.js
      - name: Commit patch
        run: |
          git config user.name findit-source-quality-bot
          git config user.email actions@users.noreply.github.com
          git add api/product-insights.js
          git commit -m 'Prefer real product pages over image-search assets [source-quality-done]'
          git push
