name: Apply FindIt Finish Hotfix
on:
  push:
    branches:
      - feat/netlify-no-gemini-finish-20260916
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/netlify-no-gemini-finish-20260916
      - name: Validate changed JavaScript and audit files
        run: |
          node --check user-first-polish.js
          node --check tests/full-site-audit.mjs
          node --check tests/final-audit-runner.mjs
          node --check tests/plan-isolation-audit.mjs
