name: Apply FindIt Finish Hotfix
on:
  push:
    branches:
      - feat/netlify-no-gemini-finish-20260916
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/netlify-no-gemini-finish-20260916
      - name: Align legacy audit with current modal system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/full-site-audit.mjs')
          s=p.read_text()
          s=s.replace("for(const s of ['#fxCompleteBody','#fxStableBody'])", "for(const s of ['#fxCommerceSafeModal[aria-hidden=\"false\"]','#fxCompleteBody','#fxStableBody'])")
          s=s.replace("for(const s of ['#fxStableModal .fx-stable-close','#fxCompleteModal .fx-complete-x','#premiumModal [data-close-modal]','#closePremium'])", "for(const s of ['#fxCommerceSafeModal[aria-hidden=\"false\"] [data-commerce-safe-close]','#fxCommerceSafeModal[aria-hidden=\"false\"] .fx-commerce-safe-close','#fxCommerceSafeModal[aria-hidden=\"false\"] button:has-text(\"Close\")','#fxStableModal .fx-stable-close','#fxCompleteModal .fx-complete-x','#premiumModal [data-close-modal]','#closePremium'])")
          s=s.replace("if(!await visible(page,'#fxStableModal:not(.hidden)'))throw Error('visible modal did not open');", "if(!await visible(page,'#fxCommerceSafeModal[aria-hidden=\"false\"],#fxStableModal:not(.hidden)'))throw Error('visible modal did not open');")
          s=s.replace("if(!await visible(page,'#fxStableModal:not(.hidden)'))throw Error('feedback modal did not open');", "if(!await visible(page,'#fxCommerceSafeModal[aria-hidden=\"false\"],#fxStableModal:not(.hidden)'))throw Error('feedback modal did not open');")
          p.write_text(s)
          PY
          node --check tests/full-site-audit.mjs
          node --check user-first-polish.js
      - name: Commit audit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/full-site-audit.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Align audit with current commerce modal"
          git push origin HEAD:feat/netlify-no-gemini-finish-20260916
