name: Apply FindIt Finish Hotfix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/netlify-no-gemini-finish-20260916
      - name: Fix user-first polish syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('user-first-polish.js')
          s=p.read_text()
          old="attributeFilter:['class','hidden'])}}"
          new="attributeFilter:['class','hidden']})}}"
          if old not in s:
              raise SystemExit('expected syntax target not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check user-first-polish.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add user-first-polish.js
          git commit -m "Fix user-first polish syntax"
          git push origin HEAD:feat/netlify-no-gemini-finish-20260916
