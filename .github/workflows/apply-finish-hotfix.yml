name: Apply FindIt Finish Hotfix
on:
  push:
    branches:
      - feat/netlify-no-gemini-finish-20260916
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/netlify-no-gemini-finish-20260916
      - name: Align audit with current commerce modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/full-site-audit.mjs')
          s=p.read_text()
          old="const visibleModal = page.locator('#fxStableModal:not(.hidden), #settingsModal:not(.hidden), #premiumModal:not(.hidden)').first();"
          new="const visibleModal = page.locator('#fxCommerceSafeModal[aria-hidden=\"false\"], #fxStableModal:not(.hidden), #settingsModal:not(.hidden), #premiumModal:not(.hidden)').first();"
          if old not in s:
              raise SystemExit('visible modal selector target not found')
          s=s.replace(old,new,1)
          old2="const close = visibleModal.locator('[data-stable-close], [data-close-modal], .modal-close').first();"
          new2="const close = visibleModal.locator('[data-commerce-safe-close], [data-stable-close], [data-close-modal], .modal-close, button:has-text(\"Close\")').first();"
          if old2 not in s:
              raise SystemExit('close selector target not found')
          p.write_text(s.replace(old2,new2,1))
          PY
          node --check tests/full-site-audit.mjs
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/full-site-audit.mjs
          git commit -m "Audit current commerce modal correctly"
          git push origin HEAD:feat/netlify-no-gemini-finish-20260916
