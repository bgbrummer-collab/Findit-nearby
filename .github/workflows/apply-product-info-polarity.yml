name: Apply Product Info Polarity

on:
  push:
    branches:
      - fix-product-info-clean-output-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-product-info-clean-output-20260903
          fetch-depth: 0
      - name: Apply contextual polarity patch
        run: python3 scripts/fix-product-info-polarity.py
      - name: Run Product Info regressions
        run: |
          node tests/product-output-cleaning-regression.mjs
          node tests/product-category-research-regression.mjs
          node tests/product-web-research-regression.mjs
      - name: Commit patched backend
        run: |
          git config user.name "findit-cleaner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/product-insights.js
          git diff --cached --quiet && exit 0
          git commit -m "Classify Product Info evidence by context [skip patch]"
          git push origin HEAD:fix-product-info-clean-output-20260903
